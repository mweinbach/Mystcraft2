name: Build ports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate port metadata
        run: python3 scripts/ports.py check
      - name: Test port management and EMC tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check EMC values for every registered item
        run: python3 scripts/emc.py check
      - name: Test ICBM material tag validation
        run: python3 -m unittest discover -s mods/icbm_port/tools/tests -v
      - name: Build all ports
        run: ./gradlew --no-daemon listPorts build
      - name: Validate ICBM resources and material mappings
        run: python3 mods/icbm_port/tools/validate_resources.py "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/fabric-loom/1.19.2/minecraft-client.jar"
      - name: Test ICBM gameplay on a dedicated Fabric server
        run: ./gradlew --no-daemon :icbm_port:runGametest -PwithItemAlchemy
      - name: Test material compatibility and datapack reloads
        run: ./gradlew --no-daemon :icbm_port:runMaterialGametest
      - name: Test Advanced Genetics and its ProjectE EMC on a dedicated Forge GameTest server
        run: ./gradlew --no-daemon :advancedgenetics:runGameTestServer -PwithProjectE
      - name: Build Advanced Genetics for Fabric
        run: ./gradlew --no-daemon -p mods/advancedgenetics/fabric build
      - name: Verify Advanced Genetics loader artifact parity
        run: python3 mods/advancedgenetics/scripts/check_loader_parity.py
      - name: Test Advanced Genetics and its Item Alchemy EMC on a dedicated Fabric GameTest server
        run: ./gradlew --no-daemon -p mods/advancedgenetics/fabric runGametest -PwithItemAlchemy
      - name: Build Mystcraft for Fabric
        run: ./gradlew --no-daemon -p mods/mystcraft/fabric build
      - name: Verify Mystcraft loader artifact parity
        run: python3 mods/mystcraft/scripts/check_loader_parity.py
      - name: Check Mystcraft EMC against ProjectE on a Forge GameTest server
        run: ./gradlew --no-daemon :mystcraft:runGameTestServer -PwithProjectE
      - name: Check Mystcraft EMC against Item Alchemy on a Fabric GameTest server
        run: ./gradlew --no-daemon -p mods/mystcraft/fabric runGametest -PwithItemAlchemy
      - name: Test JurassiCraft resources
        run: python3 -m unittest discover -s mods/jurassicraft/tools/tests -v
      - name: Build JurassiCraft for Fabric
        run: ./gradlew --no-daemon -p mods/jurassicraft/fabric build
      - name: Verify JurassiCraft loader artifact parity
        run: python3 mods/jurassicraft/scripts/check_loader_parity.py
      - name: Test JurassiCraft distributions
        run: |
          for jar in mods/jurassicraft/build/libs/jurassicraft-forge-1.19.2-*[0-9].jar \
                     mods/jurassicraft/fabric/build/libs/jurassicraft-fabric-1.19.2-*[0-9].jar; do
            JURASSICRAFT_TEST_JAR="$PWD/$jar" python3 -m unittest discover -s mods/jurassicraft/tools/tests -p test_built_jar.py -v
          done
      - name: Test JurassiCraft gameplay on a Forge GameTest server
        run: ./gradlew --no-daemon :jurassicraft:runGameTestServer -PwithProjectE
      - name: Test JurassiCraft gameplay on a Fabric GameTest server
        run: ./gradlew --no-daemon -p mods/jurassicraft/fabric runGametest -PwithJade -PwithEmi -PwithItemAlchemy
      # The headless GameTest server reports assertion messages only in these files.
      - name: Upload GameTest reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-reports
          path: |
            mods/icbm_port/build/*-results.xml
            mods/icbm_port/build/gametest/logs/latest.log
            mods/icbm_port/build/materialtest/logs/latest.log
            mods/advancedgenetics/run/gameTestServer/logs/latest.log
            mods/advancedgenetics/fabric/build/gametest-results.xml
            mods/advancedgenetics/fabric/build/gametest/logs/latest.log
            mods/mystcraft/run/gameTestServer/logs/latest.log
            mods/mystcraft/fabric/build/gametest-results.xml
            mods/mystcraft/fabric/build/gametest/logs/latest.log
            mods/jurassicraft/run/gameTestServer/logs/latest.log
            mods/jurassicraft/fabric/build/gametest-results.xml
            mods/jurassicraft/fabric/build/gametest/logs/latest.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.19.2-ports
          path: |
            mods/*/build/libs/*.jar
            mods/mystcraft/fabric/build/libs/*.jar
            mods/jurassicraft/fabric/build/libs/*.jar
            mods/advancedgenetics/fabric/build/libs/*.jar
          if-no-files-found: error
