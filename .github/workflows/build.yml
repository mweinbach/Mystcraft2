name: Build ports

# The required check is this workflow's `build` job ("Build ports / build").
# It passes only when tooling and every port job pass. Push runs on main;
# a pull request runs once via pull_request, not again via push.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-ports-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Validate port metadata
        run: python3 scripts/ports.py check
      - name: Test port management and EMC tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check EMC values for every registered item
        run: python3 scripts/emc.py check
      - name: Test ICBM material tag validation
        run: python3 -m unittest discover -s mods/icbm_port/tools/tests -v
      - name: Test JurassiCraft resources
        run: python3 -m unittest discover -s mods/jurassicraft/tools/tests -v
      - name: Check Mekanism's Fabric tag bridges are up to date
        run: python3 mods/mekanism/scripts/generate_fabric_tags.py --check
      - name: List Gradle ports
        run: ./gradlew --no-daemon listPorts

  port:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fluidphysics
            kind: fabric
            jars: mods/fluidphysics/build/libs/*.jar
            reports: |
              mods/fluidphysics/build/gametest-results.xml
              mods/fluidphysics/build/gametest/logs/latest.log
          - id: metalrender
            kind: fabric
            jars: mods/metalrender/build/libs/*.jar
            reports: |
              mods/metalrender/build/gametest-results.xml
              mods/metalrender/build/gametest/logs/latest.log
              mods/metalrender/build/reports/tests/test/
          - id: icbm_port
            kind: icbm
            fabric_compat_props: -PwithEmi -PwithJei -PwithRei
            jars: mods/icbm_port/build/libs/*.jar
            reports: |
              mods/icbm_port/build/*-results.xml
              mods/icbm_port/build/gametest/logs/latest.log
              mods/icbm_port/build/materialtest/logs/latest.log
          - id: advancedgenetics
            kind: dual
            forge_props: -PwithProjectE
            fabric_props: -PwithItemAlchemy
            jars: |
              mods/advancedgenetics/build/libs/*.jar
              mods/advancedgenetics/fabric/build/libs/*.jar
            reports: |
              mods/advancedgenetics/run/gameTestServer/logs/latest.log
              mods/advancedgenetics/fabric/build/gametest-results.xml
              mods/advancedgenetics/fabric/build/gametest/logs/latest.log
          - id: mystcraft
            kind: dual
            forge_props: -PwithProjectE
            fabric_props: -PwithItemAlchemy
            smoke: true
            jars: |
              mods/mystcraft/build/libs/*.jar
              mods/mystcraft/fabric/build/libs/*.jar
            reports: |
              mods/mystcraft/run/gameTestServer/logs/latest.log
              mods/mystcraft/run/smokeGameTestServer/logs/latest.log
              mods/mystcraft/fabric/build/gametest-results.xml
              mods/mystcraft/fabric/build/gametest/logs/latest.log
              mods/mystcraft/fabric/build/smoke-gametest-results.xml
              mods/mystcraft/fabric/build/smokegametest/logs/latest.log
          - id: buildcraft
            kind: dual
            forge_props: -PwithProjectE
            fabric_props: -PwithItemAlchemy
            jars: |
              mods/buildcraft/build/libs/*.jar
              mods/buildcraft/fabric/build/libs/*.jar
            reports: |
              mods/buildcraft/run/gameTestServer/logs/latest.log
              mods/buildcraft/fabric/build/gametest-results.xml
              mods/buildcraft/fabric/build/gametest/logs/latest.log
          - id: extremereactors
            kind: dual
            forge_props: -PwithProjectE
            fabric_props: -PwithItemAlchemy
            # Mekanism enables the steel recipes and so changes derived EMC; it runs apart from the EMC mods.
            # On Forge -PwithCompat also adds Mekanism.
            forge_compat_props: -PwithCompat
            fabric_compat_props: -PwithCompat -PwithMekanism
            jars: |
              mods/extremereactors/build/libs/*.jar
              mods/extremereactors/fabric/build/libs/*.jar
            reports: |
              mods/extremereactors/run/gameTestServer/logs/latest.log
              mods/extremereactors/fabric/build/gametest-results.xml
              mods/extremereactors/fabric/build/gametest/logs/latest.log
          - id: jurassicraft
            kind: dual
            forge_props: -PwithProjectE -PwithJade -PwithJei
            fabric_props: -PwithJade -PwithEmi -PwithItemAlchemy
            jars: |
              mods/jurassicraft/build/libs/*.jar
              mods/jurassicraft/fabric/build/libs/*.jar
            reports: |
              mods/jurassicraft/run/gameTestServer/logs/latest.log
              mods/jurassicraft/fabric/build/gametest-results.xml
              mods/jurassicraft/fabric/build/gametest/logs/latest.log
          - id: mekanism
            kind: dual
            forge_props: -PwithProjectE
            fabric_props: -PwithItemAlchemy
            forge_compat_props: -PwithJade -PwithTop -PwithComputerCraft -PwithJei -PwithCurios -PwithGender -PwithFluxNetworks -PwithRecipeStages
            fabric_compat_props: -PwithJade -PwithWthit -PwithComputerCraft -PwithJei -PwithTrinkets -PwithGender -PwithFluxNetworks
            # CraftTweaker's test scripts change recipes, so it runs on its own, apart from the other integrations.
            crafttweaker_props: -PwithCraftTweaker
            fabric_portinglib_props: -PwithPortingLib -PwithCraftTweaker
            jars: |
              mods/mekanism/build/libs/*.jar
              mods/mekanism/fabric/build/libs/*.jar
            reports: |
              mods/mekanism/run/gameTestServer/logs/latest.log
              mods/mekanism/run/gameTestServer/logs/crafttweaker.log
              mods/mekanism/fabric/build/gametest-results.xml
              mods/mekanism/fabric/build/gametest/logs/latest.log
              mods/mekanism/fabric/build/gametest/logs/crafttweaker.log
    env:
      PORT: ${{ matrix.id }}
      KIND: ${{ matrix.kind }}
      FORGE_PROPS: ${{ matrix.forge_props }}
      FABRIC_PROPS: ${{ matrix.fabric_props }}
      FORGE_COMPAT_PROPS: ${{ matrix.forge_compat_props }}
      FABRIC_COMPAT_PROPS: ${{ matrix.fabric_compat_props }}
      CRAFTTWEAKER_PROPS: ${{ matrix.crafttweaker_props }}
      FABRIC_PORTINGLIB_PROPS: ${{ matrix.fabric_portinglib_props }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and run GameTests
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-}"
          KIND="${KIND:-}"
          FORGE_PROPS="${FORGE_PROPS:-}"
          FABRIC_PROPS="${FABRIC_PROPS:-}"
          if [[ ! "$PORT" =~ ^[a-z][a-z0-9_]{1,63}$ ]]; then
            echo "Unexpected port id: $PORT" >&2
            exit 1
          fi
          gradle_with_props() {
            local props="$1"
            shift
            if [ -n "$props" ]; then
              local -a extra=()
              read -r -a extra <<< "$props"
              ./gradlew --no-daemon "$@" "${extra[@]}"
            else
              ./gradlew --no-daemon "$@"
            fi
          }
          case "$KIND" in
            fabric)
              gradle_with_props "" -p "mods/${PORT}" build
              gradle_with_props "" -p "mods/${PORT}" runGametest
              ;;
            icbm)
              gradle_with_props "" :icbm_port:build
              python3 mods/icbm_port/tools/validate_resources.py "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/fabric-loom/1.19.2/minecraft-client.jar"
              gradle_with_props "-PwithItemAlchemy" :icbm_port:runGametest
              gradle_with_props "" :icbm_port:runMaterialGametest
              ;;
            dual)
              gradle_with_props "" ":${PORT}:build"
              gradle_with_props "" -p "mods/${PORT}/fabric" build
              python3 "mods/${PORT}/scripts/check_loader_parity.py"
              if [ "$PORT" = jurassicraft ]; then
                for jar in mods/jurassicraft/build/libs/jurassicraft-forge-1.19.2-*[0-9].jar \
                           mods/jurassicraft/fabric/build/libs/jurassicraft-fabric-1.19.2-*[0-9].jar; do
                  JURASSICRAFT_TEST_JAR="$PWD/$jar" python3 -m unittest discover -s mods/jurassicraft/tools/tests -p test_built_jar.py -v
                done
              fi
              gradle_with_props "$FORGE_PROPS" ":${PORT}:runGameTestServer"
              gradle_with_props "$FABRIC_PROPS" -p "mods/${PORT}/fabric" runGametest
              ;;
            *)
              echo "Unknown port kind: $KIND" >&2
              exit 1
              ;;
          esac
      # A second GameTest run with the port's optional integrations installed, apart from the EMC runs above.
      - name: Run GameTests with optional integrations
        if: ${{ matrix.forge_compat_props || matrix.fabric_compat_props }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-}"
          if [[ ! "$PORT" =~ ^[a-z][a-z0-9_]{1,63}$ ]]; then
            echo "Unexpected port id: $PORT" >&2
            exit 1
          fi
          gradle_with_props() {
            local -a extra=()
            read -r -a extra <<< "$1"
            shift
            ./gradlew --no-daemon "$@" "${extra[@]}"
          }
          if [ "${KIND:-}" = icbm ]; then
            gradle_with_props "$FABRIC_COMPAT_PROPS" :icbm_port:runGametest
          else
            if [ -n "${FORGE_COMPAT_PROPS:-}" ]; then
              gradle_with_props "$FORGE_COMPAT_PROPS" ":${PORT}:runGameTestServer"
            fi
            if [ -n "${FABRIC_COMPAT_PROPS:-}" ]; then
              gradle_with_props "$FABRIC_COMPAT_PROPS" -p "mods/${PORT}/fabric" runGametest
            fi
          fi
      # A third GameTest run with CraftTweaker and the port's test scripts on both loaders. The scripts add and remove
      # recipes, which the CraftTweaker GameTests expect only in this run.
      - name: Run GameTests with CraftTweaker
        if: ${{ matrix.crafttweaker_props }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-}"
          if [[ ! "$PORT" =~ ^[a-z][a-z0-9_]{1,63}$ ]]; then
            echo "Unexpected port id: $PORT" >&2
            exit 1
          fi
          read -r -a extra <<< "$CRAFTTWEAKER_PROPS"
          ./gradlew --no-daemon ":${PORT}:runGameTestServer" "${extra[@]}"
          ./gradlew --no-daemon -p "mods/${PORT}/fabric" runGametest "${extra[@]}"
      # Fabric GameTests beside Porting Lib (Create Fabric's nested modules), which Fabric packs often carry, with CraftTweaker.
      # The optional-integration run above already covers the older Porting Lib nested in Flux Networks.
      - name: Run Fabric GameTests beside Porting Lib
        if: ${{ matrix.fabric_portinglib_props }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PORT:-}"
          if [[ ! "$PORT" =~ ^[a-z][a-z0-9_]{1,63}$ ]]; then
            echo "Unexpected port id: $PORT" >&2
            exit 1
          fi
          read -r -a extra <<< "$FABRIC_PORTINGLIB_PROPS"
          ./gradlew --no-daemon -p "mods/${PORT}/fabric" runGametest "${extra[@]}"
      # Mystcraft's dedicated-server smoke suite (mystcraft_smoke) runs as one GameTest on each loader's headless
      # GameTest server, the same server the GameTest runs use. It does not read eula.txt, so no EULA is accepted.
      - name: Run the Mystcraft smoke suite
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :mystcraft:runSmokeGameTestServer -PenableSmokeTests
          grep -F 'MYSTCRAFT_SMOKE_GAMETEST MYSTCRAFT_SMOKE_COMPLETE' mods/mystcraft/run/smokeGameTestServer/logs/latest.log
          ./gradlew --no-daemon -p mods/mystcraft/fabric runSmokeGametest -PenableSmokeTests
          grep -F 'MYSTCRAFT_SMOKE_GAMETEST MYSTCRAFT_SMOKE_COMPLETE' mods/mystcraft/fabric/build/smokegametest/logs/latest.log
      - name: Upload GameTest reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-reports-${{ matrix.id }}
          path: ${{ matrix.reports }}
          if-no-files-found: ignore
      - name: Upload port JARs
        uses: actions/upload-artifact@v4
        with:
          name: port-jars-${{ matrix.id }}
          path: ${{ matrix.jars }}
          if-no-files-found: error

  build:
    needs: [tooling, port]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require tooling and every port
        env:
          TOOLING: ${{ needs.tooling.result }}
          PORT: ${{ needs.port.result }}
        run: |
          set -euo pipefail
          echo "tooling=$TOOLING"
          echo "port=$PORT"
          test "$TOOLING" = success
          test "$PORT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: port-jars-*
          path: collected-jars
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.19.2-ports
          path: collected-jars
          if-no-files-found: error
