pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

rootProject.name = 'minecraft-1.19.2-ports'

file('mods').eachDir { directory ->
    if (new File(directory, 'port.properties').isFile()) {
        if (!(directory.name ==~ /[a-z][a-z0-9_]{1,63}/)) {
            throw new GradleException("Invalid mod directory: ${directory.name}")
        }
        def metadata = new Properties()
        new File(directory, 'port.properties').withInputStream { metadata.load(it) }
        def loader = metadata.getProperty('mod_loader', 'forge')
        if (loader == 'fabric') {
            // Keep Loom and ForgeGradle in separate builds/plugin classpaths.
            includeBuild(directory) { name = directory.name }
        } else if (loader == 'forge') {
            include directory.name
            project(":${directory.name}").projectDir = directory
        } else {
            throw new GradleException("Unsupported mod loader for ${directory.name}: ${loader}")
        }
    }
}
