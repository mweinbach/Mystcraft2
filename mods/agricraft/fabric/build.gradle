// AgriCraft for Fabric: the shared core in ../src/main plus the adapters in ../src/fabric. Kept as
// its own Gradle root so Loom stays isolated from ForgeGradle.
plugins {
    id 'fabric-loom' version '1.7.4'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
group = metadata.mod_group
base.archivesName = 'agricraft-fabric-1.19.2'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        // ResourcefulConfig, AgriCraft's config library (Tekxit 4 ships 1.0.20).
        url = 'https://nexus.resourcefulbees.com/repository/maven-public/'
        content { includeGroup 'com.teamresourceful.resourcefulconfig' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content {
            includeGroup 'dev.emi'
            includeGroup 'com.terraformersmc'
        }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
        }
    }
}
def reiVersion = '9.2.784'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.19.2:${project.resourcefulconfig_version}"
    // The lava bucket hook uses @ModifyExpressionValue. Tekxit 4 ships MixinExtras 0.5.0, which wins.
    include(modImplementation('io.github.llamalad7:mixinextras-fabric:0.4.1'))
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
    }
    // Recipe viewers: only their APIs are needed to compile. -PwithJei, -PwithEmi and -PwithRei add each viewer
    // to the development runs; each plugin loads only when its viewer is installed.
    modCompileOnly('mezz.jei:jei-1.19.2-fabric:11.8.1.1034') { transitive = false }
    modCompileOnly('dev.emi:emi-fabric:1.1.24+1.19.2') { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${reiVersion}") { transitive = false }
    // REI's widget API places things with Cloth's Point and Rectangle.
    compileOnly('me.shedaniel.cloth:basic-math:0.6.1') { transitive = false }
    if (providers.gradleProperty('withJei').isPresent()) {
        modRuntimeOnly('mezz.jei:jei-1.19.2-fabric:11.8.1.1034') { transitive = false }
    }
    if (providers.gradleProperty('withEmi').isPresent()) {
        modRuntimeOnly('dev.emi:emi-fabric:1.1.24+1.19.2') { transitive = false }
    }
    if (providers.gradleProperty('withRei').isPresent()) {
        modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${reiVersion}") { transitive = false }
        modRuntimeOnly('me.shedaniel.cloth:cloth-config-fabric:8.3.134') { transitive = false }
    }
    // Tooltips (Jade 8.7.3, WTHIT 5), the Mod Menu config screen and the Botania hooks are optional; only their
    // APIs are needed to compile. -PwithJade and -PwithWthit add the tooltip mods to the development runs.
    modCompileOnly('maven.modrinth:jade:ZASePpsm') { transitive = false }
    modCompileOnly('maven.modrinth:wthit:APJpZnsA') { transitive = false }
    modCompileOnly('maven.modrinth:botania:rY2B5H93') { transitive = false }
    modCompileOnly('com.terraformersmc:modmenu:4.2.0-beta.2') { transitive = false }
    if (providers.gradleProperty('withJade').isPresent()) {
        modRuntimeOnly('maven.modrinth:jade:ZASePpsm') { transitive = false }
    }
    if (providers.gradleProperty('withWthit').isPresent()) {
        modRuntimeOnly('maven.modrinth:wthit:APJpZnsA') { transitive = false }
        modRuntimeOnly('maven.modrinth:badpackets:7Y5NcPRW') { transitive = false }
    }
    // Architectury 6.6.92 for 1.19.2 is shared by Item Alchemy and REI; declare it once.
    if (providers.gradleProperty('withItemAlchemy').isPresent() || providers.gradleProperty('withRei').isPresent()) {
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
}
// The viewer flags this run was started with, so the viewer GameTest can tell "missing" from "not asked for".
def viewerFlags = ['Jei', 'Emi', 'Rei'].findAll { providers.gradleProperty("with${it}").isPresent() }
        .collect { it.toLowerCase(Locale.ROOT) }.join(',') ?: 'none'

// -PwithProjectE: this repository's ProjectE Fabric port in development runs, for the live EMC audit.
apply from: '../../../gradle/projecte-fabric.gradle'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    main {
        java.setSrcDirs(['../src/main/java', '../src/fabric/java'])
        resources.setSrcDirs(['../src/main/resources', '../src/fabric/resources'])
    }
    test.java.setSrcDirs([])
    test.resources.setSrcDirs([])
    // In-world tests are a separate development-only mod; they never enter the production JAR.
    gametest {
        java.setSrcDirs(['../src/gametestCommon/java', '../src/gametestFabric/java'])
        resources.setSrcDirs(['../src/gametestFabric/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand version: project.version, mod_description: metadata.mod_description }
    filesMatching('pack.mcmeta') { expand metadata }
}
tasks.named('processGametestResources', ProcessResources) {
    from('../src/gametestCommon/structures') { into 'data/agricraft/gametest/structures' }
}
tasks.withType(Jar).configureEach {
    from('../NOTICE.md') { into 'META-INF'; rename { 'AgriCraft-NOTICE.md' } }
}
tasks.named('jar', Jar) { from('../LICENSE') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

loom {
    accessWidenerPath = file('../src/fabric/resources/agricraft.accesswidener')
    mixin { defaultRefmapName = 'agricraft.fabric.refmap.json' }
    mods {
        agricraft { sourceSet sourceSets.main }
        agricraft_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
        gametest {
            server()
            name 'AgriCraft Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('../emc/values.json')}"
            vmArg "-Dagricraft.viewers=${viewerFlags}"
        }
    }
}
tasks.named('runGametest') {
    // Item Alchemy only reads default_emcs when it has no saved emc_config.json.
    doFirst { delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy') }
}
