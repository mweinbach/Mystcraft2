// JurassiCraft for Forge: shared gameplay plus the Forge lifecycle, transport and
// integration adapters. The Fabric variant builds from the same sources in fabric/.
sourceSets.main.java.srcDir 'src/forge/java'
sourceSets.main.resources.srcDir 'src/forge/resources'
base.archivesName = 'jurassicraft-forge-1.19.2'

// JEI is optional at runtime; its API is needed only to compile our plugin.
repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    compileOnly fg.deobf('mezz.jei:jei-1.19.2-common-api:11.6.0.1015')
    compileOnly fg.deobf('mezz.jei:jei-1.19.2-forge-api:11.6.0.1015')
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly fg.deobf('mezz.jei:jei-1.19.2-forge:11.6.0.1015')
    }
    compileOnly fg.deobf('maven.modrinth:jade:8.9.2')
    if (providers.gradleProperty('withJade').isPresent()) {
        runtimeOnly fg.deobf('maven.modrinth:jade:8.9.2')
    }
}

// Imported textures are separate from the scaffold's LGPL license. Include the
// upstream attribution and historical license with both distribution artifacts.
tasks.withType(Jar).configureEach {
    from('UPSTREAM.md') {
        into 'META-INF'
        rename { 'JurassiCraft-UPSTREAM.md' }
    }
    from('UPSTREAM-LICENSE-HISTORICAL.md') { into 'META-INF' }
}

// Loader-independent logic checks that run without launching a game server.
['ports.jurassicraft.genetics.GeneticsLogicTest', 'ports.jurassicraft.vehicle.VehiclePhysicsLogicTest',
 'ports.jurassicraft.tourrail.TourRailLogicTest', 'ports.jurassicraft.platform.NetworkLogicTest'].each { mainClassName ->
    def taskName = mainClassName.tokenize('.').last().uncapitalize()
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}

// Mirrors src/fabric/resources/jurassicraft.accesswidener; each entry documents its use.
minecraft.accessTransformer = file('src/forge/resources/META-INF/accesstransformer.cfg')

// In-world tests and datagen validation live outside the production source set and JAR.
sourceSets {
    gametest {
        java.srcDirs = ['src/gametestCommon/java', 'src/gametestForge/java']
        resources.srcDirs = ['src/gametestCommon/resources', 'src/gametestForge/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft.runs {
    gameTestServer {
        property 'forge.enabledGameTestNamespaces', 'jurassicraft'
        mods { jurassicraft { source sourceSets.gametest } }
    }
    data {
        mods { jurassicraft { source sourceSets.gametest } }
    }
}
