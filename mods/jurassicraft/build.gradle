// JurassiCraft for Forge: shared gameplay plus the Forge lifecycle, transport and
// integration adapters. The Fabric variant builds from the same sources in fabric/.
sourceSets.main.java.srcDir 'src/forge/java'
sourceSets.main.resources.srcDir 'src/forge/resources'
base.archivesName = 'jurassicraft-forge-1.19.2'

// JEI is optional at runtime; its API is needed only to compile our plugin.
repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    compileOnly fg.deobf('mezz.jei:jei-1.19.2-common-api:11.6.0.1015')
    compileOnly fg.deobf('mezz.jei:jei-1.19.2-forge-api:11.6.0.1015')
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly fg.deobf('mezz.jei:jei-1.19.2-forge:11.6.0.1015')
    }
    compileOnly fg.deobf('maven.modrinth:jade:8.9.2')
    if (providers.gradleProperty('withJade').isPresent()) {
        runtimeOnly fg.deobf('maven.modrinth:jade:8.9.2')
    }
    // ProjectE 1.1.0 (CurseForge file 4860858) checks the shipped EMC data against real values.
    if (providers.gradleProperty('withProjectE').isPresent()) {
        runtimeOnly fg.deobf('curse.maven:projecte-226410:4860858')
    }
}

// Imported textures are separate from the scaffold's LGPL license. Include the
// upstream attribution and historical license with both distribution artifacts.
tasks.withType(Jar).configureEach {
    from('UPSTREAM.md') {
        into 'META-INF'
        rename { 'JurassiCraft-UPSTREAM.md' }
    }
    from('UPSTREAM-LICENSE-HISTORICAL.md') { into 'META-INF' }
}

// Loader-independent logic checks that run without launching a game server.
['ports.jurassicraft.genetics.GeneticsLogicTest', 'ports.jurassicraft.vehicle.VehiclePhysicsLogicTest',
 'ports.jurassicraft.tourrail.TourRailLogicTest', 'ports.jurassicraft.platform.NetworkLogicTest'].each { mainClassName ->
    def taskName = mainClassName.tokenize('.').last().uncapitalize()
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}

// Mirrors src/fabric/resources/jurassicraft.accesswidener; each entry documents its use.
minecraft.accessTransformer = file('src/forge/resources/META-INF/accesstransformer.cfg')

// In-world tests and datagen validation live outside the production source set and JAR.
sourceSets {
    gametest {
        java.srcDirs = ['src/gametestCommon/java', 'src/gametestForge/java']
        resources.srcDirs = ['src/gametestCommon/resources', 'src/gametestForge/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft.runs {
    gameTestServer {
        property 'forge.enabledGameTestNamespaces', 'jurassicraft'
        property 'emc.values', file('emc/values.json').absolutePath
        mods { jurassicraft { source sourceSets.gametest } }
    }
    data {
        mods { jurassicraft { source sourceSets.gametest } }
    }
}
// Like the Fabric suite and CI, start from a fresh world so entities saved by an earlier run cannot reload into new tests.
// Forge 43.5.0 ships a default fml.toml that omits defaultConfigPath, so every fresh server
// calls ConfigSpec.correct. Correction autosaves while NightConfig's autoreload watcher
// reloads that same HashMap and intermittently throws ConcurrentModificationException
// (or tears maxThreads into a duplicate key) before any test runs. A complete file skips it.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/gameTestServer/world')
        def configDir = file('run/gameTestServer/config')
        configDir.mkdirs()
        new File(configDir, 'fml.toml').text = '''\
splashscreen = true
maxThreads = -1
versionCheck = true
defaultConfigPath = "defaultconfigs"
disableOptimizedDFU = true
'''
    }
}

// Official-name -> SRG mappings for the client-only controls mixin in the packaged JAR.
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
def forgeMixinRefmap = layout.buildDirectory.file('generated/mixin/jurassicraft.forge.refmap.json')
tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('createMcpToSrg')
    outputs.file(forgeMixinRefmap)
    doFirst { forgeMixinRefmap.get().asFile.parentFile.mkdirs() }
    options.compilerArgs += [
        '-AmappingTypes=tsrg',
        "-AreobfTsrgFile=${layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile}",
        "-AoutRefMapFile=${forgeMixinRefmap.get().asFile}",
        '-AdefaultObfuscationEnv=searge'
    ]
}
tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')
    from(forgeMixinRefmap)
}
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'jurassicraft.forge.mixins.json')
}
minecraft.runs.configureEach {
    args '--mixin.config', 'jurassicraft.forge.mixins.json'
    property 'mixin.env.remapRefMap', 'true'
    property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
}
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn tasks.named('createSrgToMcp') }
