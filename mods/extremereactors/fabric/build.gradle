plugins {
    id 'fabric-loom' version '1.7.4'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
def mekanismMetadata = new Properties()
file('../../mekanism/port.properties').withInputStream { mekanismMetadata.load(it) }
def mekanismVersion = mekanismMetadata.getProperty('mod_version')
group = metadata.mod_group
base.archivesName = 'extremereactors-fabric-1.19.2'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.patchouli'
        }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        url = 'https://squiddev.cc/maven/'
        content { includeGroup 'org.squiddev' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Team Reborn Energy is the Fabric energy standard; it is bundled so the mod has no extra install step.
    include(modImplementation('teamreborn:energy:2.3.0'))
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Optional integrations: only their APIs are needed to compile. -PwithCompat adds the mods to the dev runs.
    modCompileOnly('maven.modrinth:cc-restitched:3S6HU7nl') { transitive = false }
    modCompileOnly('mezz.jei:jei-1.19.2-common-api:11.6.0.1024') { transitive = false }
    // The handbook pages extend Patchouli's page classes, which are not part of its API jar.
    modCompileOnly('vazkii.patchouli:Patchouli:1.19.2-77-FABRIC') { transitive = false }
    modCompileOnly('dev.emi:emi-fabric:1.1.24+1.19.2:api') { transitive = false }
    // The Mekanism Fabric port, for the gas-port adapter. This is a plain compile dependency, not a
    // Loom mod dependency: Loom reads mod jars while configuring, before an included build has produced
    // one, and a clean Fabric build would fail. compileOnly keeps the port out of this JAR. The included
    // build compiles it first and supplies its classes.
    compileOnly "ports.mekanism:mekanism-fabric:${mekanismVersion}"
    if (providers.gradleProperty('withMekanism').isPresent()) {
        // A dev run does need the built mod jar. Produce it before Loom inspects the runtime mod.
        def mekanismJar = file("../../mekanism/fabric/build/libs/mekanism-fabric-1.19.2-${mekanismVersion}.jar")
        if (!mekanismJar.isFile()) {
            exec {
                workingDir file('../../..')
                commandLine file('../../../gradlew').absolutePath, '--no-daemon', '-p', 'mods/mekanism/fabric', 'remapJar'
            }
        }
        modRuntimeOnly "ports.mekanism:mekanism-fabric:${mekanismVersion}"
    }
    if (providers.gradleProperty('withCompat').isPresent()) {
        // Loom strips nested JARs from mod dependencies, so the libraries CC: Restitched and Patchouli bundle are
        // listed here; the Modrinth artifact has no POM and Patchouli's would pull in an older Fabric API.
        modRuntimeOnly 'maven.modrinth:cc-restitched:3S6HU7nl'
        runtimeOnly 'com.electronwill.night-config:core:3.6.3'
        runtimeOnly 'com.electronwill.night-config:toml:3.6.3'
        runtimeOnly('org.squiddev:Cobalt:0.5.5') { transitive = false }
        runtimeOnly 'io.netty:netty-codec-http:4.1.77.Final'
        modRuntimeOnly('vazkii.patchouli:Patchouli:1.19.2-77-FABRIC') { transitive = false }
        runtimeOnly 'me.zeroeightsix:fiber:0.23.0-2'
        // JEI and EMI both draw an item list; -PwithEmi runs EMI instead of JEI.
        if (providers.gradleProperty('withEmi').isPresent()) {
            modRuntimeOnly('dev.emi:emi-fabric:1.1.24+1.19.2') { transitive = false }
        } else {
            modRuntimeOnly('mezz.jei:jei-1.19.2-fabric:11.6.0.1024') { transitive = false }
        }
    }
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    main {
        java.setSrcDirs(['../src/main/java', '../src/fabric/java'])
        resources.setSrcDirs(['../src/main/resources', '../src/fabric/resources'])
    }
    test.java.setSrcDirs(['../src/test/java'])
    test.resources.setSrcDirs([])
    // In-world tests are a separate development-only mod; they never enter the production JAR.
    gametest {
        java.setSrcDirs(['../src/gametestCommon/java', '../src/gametestFabric/java'])
        resources.setSrcDirs(['../src/gametestCommon/resources', '../src/gametestFabric/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// Loader-independent simulation checks that run without a game server.
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand version: project.version, mod_description: metadata.mod_description }
}
tasks.withType(Jar).configureEach {
    from('../UPSTREAM.md') {
        into 'META-INF'
        rename { 'ExtremeReactors-UPSTREAM.md' }
    }
    from('../licenses') { into 'META-INF/licenses/extremereactors' }
}
tasks.named('jar', Jar) { from('../LICENSE') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

loom {
    accessWidenerPath = file('../src/fabric/resources/extremereactors.accesswidener')
    mods {
        bigreactors { sourceSet sourceSets.main }
        bigreactors_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
        gametest {
            server()
            name 'Extreme Reactors Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            // FabricGameTestSteel installs a c:steel_ingots provider on this server.
            vmArg '-Dbigreactors.gametest.steel=true'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('../emc/values.json')}"
        }
        // A client with the development-only /ershowcase command, for screenshots.
        showcaseClient {
            client()
            name 'Extreme Reactors Fabric Showcase Client'
            source sourceSets.gametest
            runDir 'build/showcase'
            programArgs '--width', '1600', '--height', '900'
        }
    }
}
tasks.named('runGametest') {
    // Item Alchemy only reads default_emcs when it has no saved emc_config.json.
    doFirst { delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy') }
}
