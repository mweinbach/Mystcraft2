plugins {
    id 'fabric-loom' version '1.7.4'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
group = metadata.mod_group
base.archivesName = 'extremereactors-fabric-1.19.2'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Team Reborn Energy is the Fabric energy standard; it is bundled so the mod has no extra install step.
    include(modImplementation('teamreborn:energy:2.3.0'))
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    main {
        java.setSrcDirs(['../src/main/java', '../src/fabric/java'])
        resources.setSrcDirs(['../src/main/resources', '../src/fabric/resources'])
    }
    test.java.setSrcDirs(['../src/test/java'])
    test.resources.setSrcDirs([])
    // In-world tests are a separate development-only mod; they never enter the production JAR.
    gametest {
        java.setSrcDirs(['../src/gametestCommon/java', '../src/gametestFabric/java'])
        resources.setSrcDirs(['../src/gametestCommon/resources', '../src/gametestFabric/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// Loader-independent simulation checks that run without a game server.
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand version: project.version, mod_description: metadata.mod_description }
}
tasks.withType(Jar).configureEach {
    from('../UPSTREAM.md') {
        into 'META-INF'
        rename { 'ExtremeReactors-UPSTREAM.md' }
    }
    from('../licenses') { into 'META-INF/licenses/extremereactors' }
}
tasks.named('jar', Jar) { from('../LICENSE') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

loom {
    accessWidenerPath = file('../src/fabric/resources/extremereactors.accesswidener')
    mods {
        bigreactors { sourceSet sourceSets.main }
        bigreactors_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
        gametest {
            server()
            name 'Extreme Reactors Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('../emc/values.json')}"
        }
        // A client with the development-only /ershowcase command, for screenshots.
        showcaseClient {
            client()
            name 'Extreme Reactors Fabric Showcase Client'
            source sourceSets.gametest
            runDir 'build/showcase'
            programArgs '--width', '1600', '--height', '900'
        }
    }
}
tasks.named('runGametest') {
    // Item Alchemy only reads default_emcs when it has no saved emc_config.json.
    doFirst { delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy') }
}
