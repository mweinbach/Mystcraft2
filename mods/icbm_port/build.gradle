plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
def reiVersion = '9.2.784'
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(modImplementation('teamreborn:energy:2.3.0'))
    modCompileOnly('mezz.jei:jei-1.19.2-fabric:11.8.1.1034') { transitive = false }
    modCompileOnly('dev.emi:emi-fabric:1.1.24+1.19.2') { transitive = false }
    // REI 9.2.x is the 1.19-1.19.2 line; only its API and default plugin are needed to compile.
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${reiVersion}") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${reiVersion}") { transitive = false }
    // REI's EntryStacks overloads name Architectury's FluidStack; javac needs it for resolution.
    modCompileOnly('maven.modrinth:architectury-api:cde9Su0w') { transitive = false }
    if (providers.gradleProperty('withJei').isPresent()) {
        modRuntimeOnly('mezz.jei:jei-1.19.2-fabric:11.8.1.1034') { transitive = false }
    }
    if (providers.gradleProperty('withEmi').isPresent()) {
        modRuntimeOnly('dev.emi:emi-fabric:1.1.24+1.19.2') { transitive = false }
    }
    if (providers.gradleProperty('withRei').isPresent()) {
        modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${reiVersion}") { transitive = false }
        modRuntimeOnly('me.shedaniel.cloth:cloth-config-fabric:8.3.134') { transitive = false }
    }
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
    }
    // Architectury 6.6.92 for 1.19.2 is shared by Item Alchemy and REI; declare it once.
    if (providers.gradleProperty('withItemAlchemy').isPresent() || providers.gradleProperty('withRei').isPresent()) {
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE-ICBM-CODE.md') }
sourcesJar { from('LICENSE-ICBM-CODE.md') }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    materialtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    tekxittest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    emitest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Run this separate test mod in the actual Tekxit distribution. It is never bundled
// in the production artifact and does not pull the modpack into normal builds.
def tekxitTestJar = tasks.register('tekxitTestJar', Jar) {
    archiveClassifier = 'tekxit-tests-dev'
    from sourceSets.tekxittest.output
}
tasks.register('remapTekxitTestJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tekxitTestJar
    inputFile = tekxitTestJar.flatMap { it.archiveFile }
    archiveClassifier = 'tekxit-tests'
    addNestedDependencies = false
}
def emiTestJar = tasks.register('emiTestJar', Jar) {
    archiveClassifier = 'emi-tests-dev'
    from sourceSets.emitest.output
}
tasks.register('remapEmiTestJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn emiTestJar
    inputFile = emiTestJar.flatMap { it.archiveFile }
    archiveClassifier = 'emi-tests'
    addNestedDependencies = false
}
// Compile the optional integration fixtures in CI without downloading/running the pack.
tasks.named('check') { dependsOn 'tekxittestClasses', 'emitestClasses' }
loom {
    accessWidenerPath = file('src/main/resources/icbm_port.accesswidener')
    mods {
        icbm_port { sourceSet sourceSets.main }
        icbm_port_gametest { sourceSet sourceSets.gametest }
        icbm_port_materialtest { sourceSet sourceSets.materialtest }
    }
    runs {
        gametest {
            server()
            name 'ICBM Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('emc/values.json')}"
            // Opt-in antimatter cost measurement (ExtremeBenchmarkGameTests); off in CI.
            if (providers.gradleProperty('icbmBenchmark').isPresent()) {
                vmArg '-Dicbm.benchmark=true'
                vmArg "-Dicbm.benchmark.radius=${providers.gradleProperty('icbmBenchmarkRadius').getOrElse('275')}"
            }
        }
        materialGametest {
            server()
            name 'ICBM Material Compatibility Tests'
            source sourceSets.materialtest
            runDir 'build/materialtest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('materialtest-results.xml').get().asFile}"
        }
    }
}

// This is Loom's disposable test world; stale queued effects must not leak between runs.
// Item Alchemy only reads default_emcs when it has no saved emc_config.json.
tasks.named('runGametest') {
    doFirst { delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy') }
}
tasks.named('runMaterialGametest') {
    doFirst { delete layout.buildDirectory.dir('materialtest/world') }
}
