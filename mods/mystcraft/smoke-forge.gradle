// Opt in with -PenableSmokeTests; these classes never enter the production JAR.
sourceSets {
    smoke {
        java.srcDirs = ['src/smoke/java', 'src/smokeForge/java']
        resources.srcDirs = ['src/smokeForge/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('smokeJar', Jar) {
    from sourceSets.smoke.output
    archiveBaseName = 'mystcraft-smoke-forge-1.19.2'
    archiveVersion = '1.0.0'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
    finalizedBy 'reobfSmokeJar'
}
reobf { smokeJar { classpath.from(sourceSets.main.output) } }

tasks.named('processSmokeResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') { expand mod_version: project.version }
}

// runSmokeGameTestServer runs the whole mystcraft_smoke suite as one GameTest (ForgeSmokeGameTest) on Forge's
// headless GameTest server, which like runGameTestServer does not read eula.txt. CI uses it; a dedicated server is
// not needed. Only the mystcraft_smoke namespace runs, so Mystcraft's own GameTests stay in runGameTestServer.
minecraft.runs {
    gameTestServer {}
    smokeGameTestServer {
        parent minecraft.runs.gameTestServer
        property 'forge.enabledGameTestNamespaces', 'mystcraft_smoke'
        mods { mystcraft_smoke { source sourceSets.smoke } }
    }
}
tasks.matching { it.name == 'runSmokeGameTestServer' }.configureEach {
    dependsOn tasks.named('smokeClasses')
    doFirst { delete file('run/smokeGameTestServer/world') }
}
