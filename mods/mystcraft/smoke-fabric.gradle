// Opt in with -PenableSmokeTests; these classes never enter the production JAR.
sourceSets {
    smoke {
        java.srcDirs = ['../src/smoke/java', '../src/smokeFabric/java']
        resources.srcDirs = ['../src/smokeFabric/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('smokeJar', Jar) {
    from sourceSets.smoke.output
    archiveBaseName = 'mystcraft-smoke-fabric-1.19.2'
    archiveVersion = '1.0.0'
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
}
tasks.register('remapSmokeJar', tasks.named('remapJar').get().class.superclass) {
    dependsOn tasks.named('smokeJar')
    inputFile = tasks.named('smokeJar', Jar).flatMap { it.archiveFile }
    archiveBaseName = 'mystcraft-smoke-fabric-1.19.2'
    archiveVersion = '1.0.0'
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('smoke-libs')
    classpath.from(sourceSets.main.output)
    addNestedDependencies = false
}

tasks.named('processSmokeResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    filesMatching('fabric.mod.json') { expand mod_version: project.version }
}

// runSmokeGametest runs the whole mystcraft_smoke suite as one GameTest (FabricSmokeGameTest) on Fabric's headless
// GameTest server, which like runGametest does not read eula.txt. CI uses it; a dedicated server is not needed.
loom {
    mods { mystcraft_smoke { sourceSet sourceSets.smoke } }
    runs {
        smokeGametest {
            server()
            name 'Mystcraft Fabric Smoke Suite'
            source sourceSets.smoke
            runDir 'build/smokegametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('smoke-gametest-results.xml').get().asFile}"
        }
    }
}
tasks.named('runSmokeGametest') {
    doFirst { delete layout.buildDirectory.dir('smokegametest/world') }
}
