// Mystcraft-specific verification; the Minecraft/Forge toolchain is shared.
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('jar', Jar) {
    from('NOTICE.md')
}

// Shared gameplay plus the Forge-specific lifecycle/transport adapters.
sourceSets.main.java.srcDir 'src/forge/java'
sourceSets.main.resources.srcDir 'src/forge/resources'
base.archivesName = 'mystcraft-forge-1.19.2'

if (providers.gradleProperty('enableSmokeTests').isPresent()) {
    apply from: file('smoke-forge.gradle')
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    // ProjectE 1.1.0 (CurseForge file 4860858) checks the shipped EMC data against real values.
    if (providers.gradleProperty('withProjectE').isPresent()) {
        runtimeOnly fg.deobf('curse.maven:projecte-226410:4860858')
    }
}

// Server GameTests are merged into the mod only for the GameTest run, never into the JAR.
sourceSets {
    gametest {
        java.srcDirs = ['src/gametestCommon/java', 'src/gametestForge/java']
        resources.srcDirs = ['src/gametestForge/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft.runs {
    gameTestServer {
        property 'forge.enabledGameTestNamespaces', 'mystcraft'
        property 'emc.values', file('emc/values.json').absolutePath
        // A test-only getAllLevels injection that must keep running beside Mystcraft's hooks.
        args '--mixin.config', 'mystcraft_gametest.mixins.json'
        mods { mystcraft { source sourceSets.gametest } }
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn tasks.named('gametestClasses') }

// Generate official-name -> SRG mappings for client-only mixins in packaged Forge JARs.
// Loom independently generates the Fabric refmap from its own adapter sources.
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }

// Forge 43 does not bundle MixinExtras (@WrapOperation); nest it as Fabric does with include().
jarJar.enable()
dependencies {
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) { jarJar.ranged(it, '[0.4.1,)') }
}
// The nested JAR is the published artifact; the plain JAR keeps a classifier.
tasks.named('jar', Jar) { archiveClassifier = 'slim' }
tasks.named('jarJar') {
    archiveClassifier = ''
    from('NOTICE.md')
    from('LICENSE')
    manifest.attributes('Implementation-Title': portMetadata.mod_name,
                        'Implementation-Version': portMetadata.mod_version,
                        'MixinConfigs': 'mystcraft.forge.mixins.json')
    finalizedBy 'reobfJarJar'
}
reobf { jarJar {} }
tasks.named('assemble') { dependsOn tasks.named('jarJar') }
def forgeMixinRefmap = layout.buildDirectory.file('generated/mixin/mystcraft.forge.refmap.json')
tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('createMcpToSrg')
    outputs.file(forgeMixinRefmap)
    doFirst { forgeMixinRefmap.get().asFile.parentFile.mkdirs() }
    options.compilerArgs += [
        '-AmappingTypes=tsrg',
        "-AreobfTsrgFile=${layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile}",
        "-AoutRefMapFile=${forgeMixinRefmap.get().asFile}",
        '-AdefaultObfuscationEnv=searge'
    ]
}
// Development run classpaths need the same refmap as the packaged JAR.
tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')
    from(forgeMixinRefmap)
}
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'mystcraft.forge.mixins.json')
}
minecraft.runs.configureEach {
    args '--mixin.config', 'mystcraft.forge.mixins.json'
    property 'mixin.env.remapRefMap', 'true'
    property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
}
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn tasks.named('createSrgToMcp') }
