pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'mystcraft-fabric'

// The Fluid Physics library is bundled into this JAR and gives black ink Forge FluidType entity physics on Fabric.
includeBuild('../../fluidphysics') {
    dependencySubstitution {
        substitute module('ports.fluidphysics:fluidphysics-fabric') using project(':')
    }
}
