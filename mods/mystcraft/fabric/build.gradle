plugins {
    id 'fabric-loom' version '1.7.4'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
group = metadata.mod_group
base.archivesName = 'mystcraft-fabric-1.19.2'

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
    minecraft 'com.mojang:minecraft:1.19.2'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2'
    include(modImplementation('io.github.llamalad7:mixinextras-fabric:0.4.1'))
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    main {
        java.setSrcDirs(['../src/main/java', '../src/fabric/java'])
        resources.setSrcDirs(['../src/main/resources', '../src/fabric/resources'])
        resources.exclude 'META-INF/mods.toml'
    }
    test.java.setSrcDirs(['../src/test/java'])
    test.resources.setSrcDirs(['../src/test/resources'])
    // Server GameTests are a separate development-only mod; they never enter the production JAR.
    gametest {
        java.setSrcDirs(['../src/gametestCommon/java', '../src/gametestFabric/java'])
        resources.setSrcDirs(['../src/gametestFabric/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mixin { defaultRefmapName = 'mystcraft.fabric.refmap.json' }
    mods {
        mystcraft { sourceSet sourceSets.main }
        mystcraft_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
        gametest {
            server()
            name 'Mystcraft Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('../emc/values.json')}"
        }
    }
}
tasks.named('runGametest') {
    // Item Alchemy only reads default_emcs when it has no saved emc_config.json.
    doFirst { delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy') }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    inputs.property 'mod_name', metadata.mod_name
    filesMatching('fabric.mod.json') { expand version: project.version }
    filesMatching('pack.mcmeta') { expand metadata }
}
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('jar', Jar) {
    from('../LICENSE')
    from('../NOTICE.md')
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

if (providers.gradleProperty('enableSmokeTests').isPresent()) {
    apply from: file('../smoke-fabric.gradle')
}
