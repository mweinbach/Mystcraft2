plugins {
    id 'fabric-loom' version '1.6.12'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
group = metadata.mod_group
base.archivesName = 'mystcraft-fabric-1.19.2'

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.19.2'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2'
    include(modImplementation('io.github.llamalad7:mixinextras-fabric:0.4.1'))
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    main {
        java.setSrcDirs(['../src/main/java', '../src/fabric/java'])
        resources.setSrcDirs(['../src/main/resources', '../src/fabric/resources'])
        resources.exclude 'META-INF/mods.toml'
    }
    test.java.setSrcDirs(['../src/test/java'])
    test.resources.setSrcDirs(['../src/test/resources'])
}
loom {
    mixin { defaultRefmapName = 'mystcraft.fabric.refmap.json' }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    inputs.property 'mod_name', metadata.mod_name
    filesMatching('fabric.mod.json') { expand version: project.version }
    filesMatching('pack.mcmeta') { expand metadata }
}
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work').get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('jar', Jar) {
    from('../LICENSE')
    from('../NOTICE.md')
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

if (providers.gradleProperty('enableSmokeTests').isPresent()) {
    apply from: file('../smoke-fabric.gradle')
}
