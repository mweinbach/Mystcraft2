plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modCompileOnly 'maven.modrinth:jade:ZASePpsm'
    modCompileOnly 'maven.modrinth:emi:fgTjvcl1'
    if (providers.gradleProperty('withJade').isPresent()) {
        modRuntimeOnly 'maven.modrinth:jade:ZASePpsm'
    }
    if (providers.gradleProperty('withEmi').isPresent()) {
        modRuntimeOnly 'maven.modrinth:emi:fgTjvcl1'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
tasks.register('testMachineModels', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ports.jurassicraft.model.client.MachineObjModelTest'
    workingDir projectDir.parentFile.parentFile
}
tasks.named('check') { dependsOn tasks.named('testMachineModels') }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    // The Forge and Fabric ports use the same imported art and sound assets.
    // Loader-specific data is explicitly ported under this build's resources.
    from('../jurassicraft/src/main/resources') { assetSpec ->
        assetSpec.include 'assets/**'
        ['cleaning_station', 'dna_combinator_hybridizer', 'dna_extractor', 'dna_sequencer',
         'dna_synthesizer', 'embryo_calcification_machine', 'embryonic_machine', 'feeder', 'incubator'].each {
            assetSpec.exclude "assets/jurassicraft/models/block/${it}.json"
        }
    }
}
tasks.withType(Jar).configureEach {
    from('../jurassicraft/UPSTREAM.md') {
        into 'META-INF'
        rename { 'JurassiCraft-UPSTREAM.md' }
    }
    from('../jurassicraft/UPSTREAM-LICENSE-HISTORICAL.md') { into 'META-INF' }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        jurassicraft { sourceSet sourceSets.main }
        jurassicraft_fabric_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'JurassiCraft Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
        }
    }
}
tasks.named('runGametest') {
    doFirst { delete layout.buildDirectory.dir('gametest/world') }
}
