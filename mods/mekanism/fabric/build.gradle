plugins {
    id 'fabric-loom' version '1.7.4'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
def fluidPhysicsMetadata = new Properties()
file('../../fluidphysics/port.properties').withInputStream { fluidPhysicsMetadata.load(it) }
def fluidPhysicsVersion = fluidPhysicsMetadata.getProperty('mod_version')
// Loom reads the included library's JAR while this build configures. A clean checkout has not produced it yet.
def fluidPhysicsJar = file("../../fluidphysics/build/libs/fluidphysics-fabric-1.19.2-${fluidPhysicsVersion}.jar")
if (!fluidPhysicsJar.isFile()) {
    exec {
        workingDir file('../../..')
        commandLine file('../../../gradlew').absolutePath, '--no-daemon', '-p', 'mods/fluidphysics', 'remapJar'
    }
}
group = metadata.mod_group
base.archivesName = 'mekanism-fabric-1.19.2'
def withCraftTweaker = providers.gradleProperty('withCraftTweaker').isPresent()

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'com.blamejared.crafttweaker'
            includeGroup 'com.faux.ingredientextension'
            includeGroup 'com.faux.fauxcustomentitydata'
        }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.ladysnake.org/releases'
        content { includeGroup 'dev.onyxstudios.cardinal-components-api' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Team Reborn Energy is the Fabric energy standard; it is bundled so the mod has no extra install step.
    include(modImplementation('teamreborn:energy:2.3.0'))
    // fabric-permissions-api is the API Fabric permission mods (LuckPerms and others) answer. Forge's PermissionAPI
    // defers to the installed permission handler the same way. 0.3.1 only references intermediary members that exist
    // in 1.19.2 (Entity.createCommandSourceStack, SharedSuggestionProvider.hasPermission, MinecraftServer.getProfilePermissions).
    // Not transitive: its POM resolves fabric-api-base through the 1.20.4 Fabric API BOM.
    include(modImplementation('me.lucko:fabric-permissions-api:0.3.1') { transitive = false })
    // Forge's FluidType entity physics for Mekanism's fluids; the library is bundled for clients and servers.
    include(modImplementation("ports.fluidphysics:fluidphysics-fabric:${fluidPhysicsVersion}"))
    // Forge ships Night Config; Fabric gets the same version bundled for the TOML config files.
    include(implementation('com.electronwill.night-config:core:3.6.6'))
    include(implementation('com.electronwill.night-config:toml:3.6.6'))
    // Forge ships maven-artifact; Mekanism compares mod versions with it.
    include(implementation('org.apache.maven:maven-artifact:3.8.5'))
    // Jade 8.7.3 and WTHIT 5.36.1 are optional. The plugin classes stay in the JAR; neither mod is required to load.
    // -PwithJade and -PwithWthit add them to a development run.
    modCompileOnly('maven.modrinth:jade:ZASePpsm') { transitive = false }
    modCompileOnly('maven.modrinth:wthit:APJpZnsA') { transitive = false }
    if (providers.gradleProperty('withJade').isPresent()) {
        modRuntimeOnly('maven.modrinth:jade:ZASePpsm') { transitive = false }
    }
    if (providers.gradleProperty('withWthit').isPresent()) {
        modRuntimeOnly('maven.modrinth:wthit:APJpZnsA') { transitive = false }
        modRuntimeOnly('maven.modrinth:badpackets:7Y5NcPRW') { transitive = false }
    }
    // CC: Tweaked published no Fabric jar for 1.19.2. CC: Restitched 1.101.2 is that line's Fabric build and uses the
    // mod id computercraft. The peripheral classes stay in the JAR; the mod is not required to load.
    // -PwithComputerCraft adds it to a development run.
    modCompileOnly('maven.modrinth:cc-restitched:3S6HU7nl') { transitive = false }
    testImplementation('maven.modrinth:cc-restitched:3S6HU7nl') { transitive = false }
    if (providers.gradleProperty('withComputerCraft').isPresent()) {
        modRuntimeOnly('maven.modrinth:cc-restitched:3S6HU7nl') { transitive = false }
    }
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // JEI is optional at runtime. The plugin entrypoint is only loaded when JEI asks for it.
    modCompileOnly 'mezz.jei:jei-1.19.2-common-api:11.6.0.1015'
    modCompileOnly 'mezz.jei:jei-1.19.2-fabric-api:11.6.0.1015'
    if (providers.gradleProperty('withJei').isPresent()) {
        modRuntimeOnly('mezz.jei:jei-1.19.2-fabric:11.6.0.1015') {
            transitive = false
        }
    }
    // Trinkets 3.4.2 is the 1.19.2 Fabric equivalent of Curios. Cardinal Components Base is nested in that jar and is
    // required to compile against TrinketComponent. Neither mod is required to load.
    modCompileOnly('maven.modrinth:trinkets:OLwsMJv4') { transitive = false }
    compileOnly('dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.0.0-beta.1') { transitive = false }
    if (providers.gradleProperty('withTrinkets').isPresent()) {
        modRuntimeOnly('maven.modrinth:trinkets:OLwsMJv4') { transitive = false }
        modRuntimeOnly('dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.0.0-beta.1') { transitive = false }
        modRuntimeOnly('dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.0.0-beta.1') { transitive = false }
    }
    // Female Gender Mod fabric-1.19.2-3.0.1 (CurseForge file 4023966). Metadata version is 1.19-3.0.0.
    modCompileOnly('curse.maven:female-gender-456319:4023966') { transitive = false }
    if (providers.gradleProperty('withGender').isPresent()) {
        modRuntimeOnly('curse.maven:female-gender-456319:4023966') { transitive = false }
    }
    // Flux Networks for Fabric 1.19.2-7.2.1.16 (Modrinth 1HFd7hEa) is shurik204's MIT port. It moves energy through Team
    // Reborn Energy, which Mekanism already offers, so nothing compiles against it. -PwithFluxNetworks adds it to a
    // development run, with the Porting Lib 2.1.1177 and Simple Chunk Manager it nests. -PwithPortingLib adds Porting Lib
    // 2.1.1453 as Create for Fabric 0.5.1-i build 1630 (Modrinth XMiAOQvM), the newest 1.19.2 Create, nests it; Create
    // itself is left out because it registers GameTests of its own. Both runs check that Porting Lib's methods on vanilla
    // classes no longer clash with the port's Forge API layer (parity/20-porting-lib.md).
    def portingLibMods = [
        withFluxNetworks: ['maven.modrinth:flux-network-fabric:1HFd7hEa', true],
        withPortingLib  : ['maven.modrinth:create-fabric:XMiAOQvM', false],
    ].findAll { providers.gradleProperty(it.key).isPresent() }.values()
    if (!portingLibMods.isEmpty()) {
        // Loom remaps mod dependencies while configuring, and its development copy drops nested jars, so they are unpacked
        // here, recursively, and added once per mod id: the newest, as Fabric Loader picks in a normal install. Mods the run
        // already has (Fabric API, Team Reborn Energy, Night Config, MixinExtras) are left out.
        def nestedDir = layout.buildDirectory.dir('nested-mods').get().asFile
        def slurper = new groovy.json.JsonSlurper().setType(groovy.json.JsonParserType.LAX)
        def provided = ~/fabric.*|team_reborn_energy|com_electronwill_night-config_.*|mixinextras|com_github_llamalad7_mixinextras/
        def versionParts = { String version -> (version ?: '0').split('\\+')[0].findAll(/\d+/).collect { it as long } }
        def isNewer = { List<Long> a, List<Long> b ->
            def difference = [a, b].transpose().find { it[0] != it[1] }
            difference ? difference[0] > difference[1] : a.size() > b.size()
        }
        def nestedJars = { File jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                zip.entries().toList().findAll { !it.directory && it.name ==~ /META-INF\/jars\/[^\/]+\.jar/ }.collect { entry ->
                    def out = new File(nestedDir, entry.name.substring('META-INF/jars/'.length()))
                    if (!out.isFile()) {
                        out.parentFile.mkdirs()
                        zip.getInputStream(entry).withCloseable { input -> out.bytes = input.bytes }
                    }
                    out
                }
            }
        }
        def chosen = [:]
        def visit
        visit = { File jar, Closure<Boolean> accept ->
            def meta = new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def entry = zip.getEntry('fabric.mod.json')
                entry ? zip.getInputStream(entry).withCloseable { slurper.parse(it) } : [:]
            }
            String id = meta.id ?: jar.name
            if (!accept(id) || id ==~ provided) {
                return
            }
            def version = versionParts(meta.version as String)
            if (!chosen[id] || isNewer(version, chosen[id].version)) {
                chosen[id] = [version: version, file: jar]
            }
            nestedJars(jar).each { visit(it, { true }) }
        }
        portingLibMods.each { String notation, boolean withMod ->
            if (withMod) {
                modRuntimeOnly(notation) { transitive = false }
            }
            File modJar = configurations.detachedConfiguration(dependencies.create(notation) { transitive = false }).singleFile
            Closure<Boolean> accept = withMod ? { true } : { String id -> id.startsWith('porting_lib') || id == 'forge_tags' }
            nestedJars(modJar).each { visit(it, accept) }
        }
        modRuntimeOnly files(chosen.values().collect { it.file })
    }
    // CraftTweaker 10.1.44, the version upstream Mekanism 10.3.9 compiled against on Forge, is optional. CraftTweaker
    // finds the integration by scanning for its annotations, so nothing loads those classes when the mod is absent.
    // -PwithCraftTweaker adds it to a development run with its runtime dependencies. Loom drops the jars CraftTweaker
    // nests (Reflections and Javassist), so they are listed here.
    modCompileOnly('com.blamejared.crafttweaker:CraftTweaker-fabric-1.19.2:10.1.44') { transitive = false }
    if (withCraftTweaker) {
        modRuntimeOnly('com.blamejared.crafttweaker:CraftTweaker-fabric-1.19.2:10.1.44') { transitive = false }
        modRuntimeOnly('com.faux.ingredientextension:IngredientExtensionAPI-fabric-1.19.2:3.0.5') { transitive = false }
        modRuntimeOnly('com.faux.fauxcustomentitydata:FauxCustomEntityData-fabric-1.19.2:2.0.2') { transitive = false }
        runtimeOnly('org.reflections:reflections:0.10.2') { transitive = false }
        runtimeOnly('org.javassist:javassist:3.29.0-GA') { transitive = false }
    }
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.quicktheories:quicktheories:0.26'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
// The shared sources are upstream Forge code. On Fabric their Forge API references point at the port's mirror in
// src/fabric/java/ports/mekanism/lib; the rewrite keeps line numbers unchanged. Methods Forge adds to vanilla classes
// are injected interfaces, but Java has no way to add constructors, static methods or fields to a vanilla class, so
// those uses are rewritten to the port's equivalents in ports.mekanism.lib.patched or to accessor methods.
def patched = 'ports.mekanism.lib.patched.'
def forgeOnlyVanillaMembers = [
    [~/\bnet\.minecraftforge\./, 'ports.mekanism.lib.'],
    [~/\bBucketItem::new\b/, "${patched}ForgeBucketItem::new"],
    [~/\bclass (\w+) extends BucketItem\b/, "class \$1 extends ${patched}ForgeBucketItem"],
    [~/\bclass (\w+) extends CreativeModeTab\b/, "class \$1 extends ${patched}ForgeCreativeModeTab"],
    [~/\bextends AbstractContainerScreen</, "extends ${patched}ForgeAbstractContainerScreen<"],
    [~/\bItemProperties\.register\(/, "${patched}ForgeItemProperties.register("],
    [~/\bnew LiquidBlock\(/, "new ${patched}ForgeLiquidBlock("],
    [~/\bclass (\w+) extends StairBlock\b/, "class \$1 extends ${patched}ForgeStairBlock"],
    [~/\bextends KeyMapping\b/, 'extends ports.mekanism.lib.client.settings.ForgeKeyMapping'],
    [~/\bItemTags\.create\(/, "${patched}ForgeTagKeys.item("],
    [~/\bBlockTags\.create\(/, "${patched}ForgeTagKeys.block("],
    [~/\bFluidTags\.create\(/, "${patched}ForgeTagKeys.fluid("],
    [~/\bItemPredicate\.register\(/, "${patched}ForgeItemPredicates.register("],
    [~/\bInventoryScreen\.renderEntityInInventoryRaw\(/, "${patched}ForgeInventoryScreen.renderEntityInInventoryRaw("],
    [~/\bItemBlockRenderTypes\.setRenderLayer\(/, "${patched}ForgeRenderLayers.setRenderLayer("],
    [~/\bnew ShaderInstance\(/, "${patched}ForgeShaders.create("],
    [~/\.restoringBlockSnapshots = (true|false)\b/, '.setRestoringBlockSnapshots($1)'],
    [~/\.customData\b/, '.getCustomData()'],
]
// Porting Lib, which Create, Flux Networks and many other Fabric mods nest, adds its own Forge-shaped methods to vanilla
// classes. Where the port's Forge API layer added a method with the same name and descriptor to the same class, the JVM
// refused the call ("Conflicting default methods") or one mod's mixin replaced the other's method, so each mod's hooks
// ran the other's code. On Fabric the port names those methods mekanism$<name>: in the API layer and its mixins, and in
// the shared sources through these rules (parity/20-porting-lib.md). scripts/fabric_clashes.py checks the built
// jars against the Porting Lib versions Create and Flux Networks nest.
// These names mean only the Forge methods in the shared sources, so every occurrence is renamed.
def portingLibClashes = ['onLoad', 'invalidateCaps', 'serializeNBT', 'deserializeNBT', 'getCreatorModId',
                         'getDefaultTooltipHideFlags', 'onBlockStartBreak', 'getSlotIndex', 'isCurativeItem', 'getExpDrop',
                         'isShearable', 'onSheared', 'rotateTransform', 'isIdentity', 'updateSprite']
def mekanismName = 'mekanism\\$'
forgeOnlyVanillaMembers += [
    [java.util.regex.Pattern.compile('(?<![\\w$])(' + portingLibClashes.join('|') + ')\\b'), "${mekanismName}\$1"],
    // These names also mean vanilla or Mekanism methods, so only the Forge overloads, or the files that use them, change.
    // Forge's VertexConsumer.putBulkData with alpha and readExistingColor; vanilla's overloads take no alpha.
    [~/\.putBulkData\((?=[^;]*,\s*(true|false)\)\s*;)/, ".${mekanismName}putBulkData("],
    [~/\bsetBackground\(/, "${mekanismName}setBackground(", ~/\/inventory\/container\/slot\/(ArmorSlot|OffhandSlot)\.java$/],
    [~/\.set([XYZ])\(/, ".${mekanismName}set\$1(", ~/\/client\/render\/RenderResizableCuboid\.java$/],
    // Tier.getTag: Mekanism Tools' materials are its only users.
    [~/\bgetTag\(\)/, "${mekanismName}getTag()", ~/^mekanism\/tools\/common\/material\//],
]
def rewriteForFabric = { String path, String line ->
    forgeOnlyVanillaMembers.inject(line) { String result, rule ->
        rule.size() > 2 && !(path =~ rule[2]) ? result : result.replaceAll(rule[0], rule[1].toString())
    }
}
// Shared code that needs an API Fabric's build of a library does not have (CraftTweaker for Fabric 1.19.2 has no fluid
// stacks) sits between '// region forge-only' and '// endregion forge-only' lines. The Fabric copy blanks those lines,
// markers included, so line numbers still match the shared source. An unclosed or nested region fails the build.
class StripForgeOnlyRegions extends FilterReader {
    static final java.util.regex.Pattern BEGIN = ~/^\s*\/\/ region forge-only\b.*/
    static final java.util.regex.Pattern END = ~/^\s*\/\/ endregion forge-only\b.*/

    StripForgeOnlyRegions(Reader input) {
        super(new StringReader(strip(input.text)))
    }

    static String strip(String text) {
        boolean inRegion = false
        int lineNumber = 0
        StringBuilder out = new StringBuilder(text.length())
        for (String line : text.split('\n', -1)) {
            lineNumber++
            boolean begin = BEGIN.matcher(line).matches()
            boolean end = END.matcher(line).matches()
            if (begin && inRegion || end && !inRegion) {
                throw new GradleException("Unbalanced forge-only region at line ${lineNumber}")
            }
            boolean blank = inRegion || begin
            if (begin) inRegion = true
            if (end) inRegion = false
            if (out.length() > 0 || lineNumber > 1) out.append('\n')
            out.append(blank ? (line.endsWith('\r') ? '\r' : '') : line)
        }
        if (inRegion) {
            throw new GradleException('Unclosed forge-only region')
        }
        return out.toString()
    }
}
def rewrittenMain = layout.buildDirectory.dir('generated/sources/fabricShared/main')
def rewrittenTest = layout.buildDirectory.dir('generated/sources/fabricShared/test')
def rewrittenGametest = layout.buildDirectory.dir('generated/sources/fabricShared/gametest')
def rewriteRules = forgeOnlyVanillaMembers.collect { it.join(' -> ') }
def rewriteShared = { Sync task, Object sources, Object into, boolean stripForgeOnly = true ->
    task.inputs.property 'rewriteRules', rewriteRules
    task.from sources
    task.into into
    if (stripForgeOnly) {
        task.filter StripForgeOnlyRegions
    }
    task.eachFile { FileCopyDetails details ->
        String path = details.path
        details.filter { String line -> rewriteForFabric(path, line) }
    }
}
def rewriteMain = tasks.register('rewriteSharedSources', Sync) { rewriteShared(it, '../src/main/java', rewrittenMain) }
def rewriteTest = tasks.register('rewriteSharedTestSources', Sync) { rewriteShared(it, '../src/test/java', rewrittenTest, false) }
// Generators, Tools and Additions are separate mod jars. Their shared sources are rewritten like the core module.
def rewriteModule = { String name ->
    tasks.register("rewrite${name.capitalize()}Sources", Sync) {
        rewriteShared(it, "../src/${name}/java", layout.buildDirectory.dir("generated/sources/fabricShared/${name}"))
    }
}
def rewriteGenerators = rewriteModule('generators')
def rewriteTools = rewriteModule('tools')
def rewriteAdditions = rewriteModule('additions')
def rewriteGametest = tasks.register('rewriteSharedGametestSources', Sync) {
    rewriteShared(it, '../src/gametestCommon/java', rewrittenGametest)
}
sourceSets {
    main {
        java.setSrcDirs([rewriteMain, '../src/fabric/java'])
        // Listed first so its forge: tag bridges replace the shared tags at the same paths (see processResources).
        resources.setSrcDirs(['../src/fabric/resources', '../src/main/resources'])
    }
    test.java.setSrcDirs([rewriteTest])
    test.resources.setSrcDirs([])
    generators {
        java.setSrcDirs([rewriteGenerators, '../src/generators/fabric/java'])
        resources.setSrcDirs(['../src/generators/fabric/resources', '../src/generators/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    tools {
        java.setSrcDirs([rewriteTools, '../src/tools/fabric/java'])
        resources.setSrcDirs(['../src/tools/fabric/resources', '../src/tools/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    additions {
        java.setSrcDirs([rewriteAdditions, '../src/additions/fabric/java'])
        resources.setSrcDirs(['../src/additions/fabric/resources', '../src/additions/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // In-world tests are a separate development-only mod; they never enter the production JAR.
    gametest {
        java.setSrcDirs([rewriteGametest, '../src/gametestFabric/java'])
        resources.setSrcDirs(['../src/gametestFabric/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        compileClasspath += sourceSets.generators.output + sourceSets.tools.output + sourceSets.additions.output
        runtimeClasspath += sourceSets.generators.output + sourceSets.tools.output + sourceSets.additions.output
    }
}
// The EMC audit's data-side check is split out so a JUnit test can run it without a server.
sourceSets.test.compileClasspath += sourceSets.gametest.output
sourceSets.test.runtimeClasspath += sourceSets.gametest.output
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir layout.buildDirectory.dir('test-work').get().asFile
    dependsOn tasks.named('gametestClasses')
    doFirst { workingDir.mkdirs() }
}

tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    // scripts/generate_fabric_tags.py writes Fabric tags that repeat the shared values they replace.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Literal replacement rather than expand(): injected interface keys contain '$' (nested intermediary classes).
    def version = project.version.toString()
    filesMatching('fabric.mod.json') {
        filter { String line -> line.replace('${version}', version).replace('${mod_description}', metadata.mod_description) }
    }
}
tasks.withType(Jar).configureEach {
    from('../UPSTREAM.md') {
        into 'META-INF'
        rename { 'Mekanism-UPSTREAM.md' }
    }
    from('../licenses') { into 'META-INF/licenses/mekanism' }
}
tasks.named('jar', Jar) { from('../LICENSE') }
def moduleVersion = project.version.toString()
['generators', 'tools', 'additions'].each { String name ->
    tasks.named("process${name.capitalize()}Resources", ProcessResources) {
        from('../src/main/resources/logo.png')
        filesMatching('fabric.mod.json') {
            filter { String line -> line.replace('${version}', moduleVersion) }
        }
    }
}
// Each module jar depends on the core jar and does not bundle the core's nested libraries.
def remapModule = { String name, String modId ->
    def named = tasks.register("${name}NamedJar", Jar) {
        from sourceSets.getByName(name).output
        archiveBaseName = "${modId}-fabric-1.19.2"
        archiveClassifier = 'named'
        destinationDirectory = layout.buildDirectory.dir('devlibs')
        from('../LICENSE')
    }
    tasks.register("remap${name.capitalize()}Jar", net.fabricmc.loom.task.RemapJarTask) {
        dependsOn named
        inputFile = named.flatMap { it.archiveFile }
        classpath.from(sourceSets.getByName(name).compileClasspath)
        archiveBaseName = "${modId}-fabric-1.19.2"
        archiveClassifier = ''
        addNestedDependencies = false
    }
}
def remapGenerators = remapModule('generators', 'mekanismgenerators')
def remapTools = remapModule('tools', 'mekanismtools')
def remapAdditions = remapModule('additions', 'mekanismadditions')
tasks.named('assemble') { dependsOn remapGenerators, remapTools, remapAdditions }
// The port's Forge API layer must not add methods Porting Lib also adds to vanilla classes, or redirect calls Porting Lib
// redirects (parity/20-porting-lib.md). scripts/fabric_clashes.py compares the built jars with the Porting Lib versions
// Flux Networks 1.19.2-7.2.1.16 and Create 0.5.1-i build 1630 nest.
def portingLibReference = configurations.detachedConfiguration(
      dependencies.create('maven.modrinth:flux-network-fabric:1HFd7hEa') { transitive = false },
      dependencies.create('maven.modrinth:create-fabric:XMiAOQvM') { transitive = false })
def checkPortingLibClashes = tasks.register('checkPortingLibClashes', Exec) {
    group = 'verification'
    description = "Checks the jars against Porting Lib's methods on vanilla classes and its redirects."
    def ours = files([tasks.named('remapJar'), remapGenerators, remapTools, remapAdditions].collect { jar -> jar.flatMap { it.archiveFile } })
    def script = file('../../../scripts/fabric_clashes.py')
    inputs.files(ours, portingLibReference, script)
    executable 'python3'
    argumentProviders.add({
        def intermediary = net.fabricmc.loom.api.mappings.layered.MappingsNamespace.INTERMEDIARY
        [script.path, '--minecraft', *loom.getMinecraftJars(intermediary).collect { it.toString() },
         '--mappings', loom.mappingConfiguration.tinyMappings.toString(),
         '--ours', *ours.files.collect { it.path }, '--theirs', *portingLibReference.files.collect { it.path }]
    } as CommandLineArgumentProvider)
}
tasks.named('check') { dependsOn checkPortingLibClashes }
tasks.named('sourcesJar', Jar) { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

loom {
    accessWidenerPath = file('../src/fabric/resources/mekanism.accesswidener')
    // Each mod jar carries the refmap its mixin config names. Loom's default for a non-main source set is
    // '<sourceSet>-<defaultRefmapName>', which no config declares, so production (intermediary) installs could not
    // resolve the module mixins' targets. Generators and Tools have no mixins and get no annotation processor.
    mixin {
        defaultRefmapName = 'mekanism.refmap.json'
        add(sourceSets.main, 'mekanism.refmap.json')
        add(sourceSets.additions, 'mekanismadditions.refmap.json')
    }
    mods {
        mekanism { sourceSet sourceSets.main }
        mekanismgenerators { sourceSet sourceSets.generators }
        mekanismtools { sourceSet sourceSets.tools }
        mekanismadditions { sourceSet sourceSets.additions }
        mekanism_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
        gametest {
            server()
            name 'Mekanism Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dmekanism.gametest.computer=true'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('../emc/values.json')}"
            if (withCraftTweaker) {
                vmArg '-Dmekanism.gametest.crafttweaker=true'
            }
        }
        // A client with the development-only block row, for one screenshot. Not part of the production JAR.
        showcaseClient {
            client()
            name 'Mekanism Fabric Block Showcase'
            source sourceSets.gametest
            runDir 'build/showcase'
            programArgs '--width', '1600', '--height', '900'
        }
        // Jade is runtime-only when -PwithJade is set. The property keeps the block-row client from hiding the HUD.
        jadeClient {
            client()
            name 'Mekanism Fabric Jade Screenshot'
            source sourceSets.gametest
            runDir 'build/jade-client'
            programArgs '--width', '1600', '--height', '900'
            vmArg '-Dmekanism.jade.screenshot=true'
        }
        // A fueled fission reactor, for one screenshot. Not part of the production JAR.
        fissionClient {
            client()
            name 'Mekanism Fabric Fission Screenshot'
            source sourceSets.gametest
            runDir 'build/fission-client'
            programArgs '--width', '1600', '--height', '900'
            vmArg '-Dmekanism.fission.screenshot=true'
        }
        // CC: Restitched is runtime-only when -PwithComputerCraft is set.
        computerClient {
            client()
            name 'Mekanism Fabric ComputerCraft Screenshot'
            source sourceSets.gametest
            runDir 'build/computer-client'
            programArgs '--width', '1600', '--height', '900'
            vmArg '-Dmekanism.computercraft.screenshot=true'
        }
        // A survival client that equips a filled jetpack. Not part of the production JAR.
        jetpackClient {
            client()
            name 'Mekanism Fabric Jetpack Screenshot'
            source sourceSets.gametest
            runDir 'build/jetpack-client'
            programArgs '--width', '1600', '--height', '900'
            vmArg '-Dmekanism.jetpack.screenshot=true'
        }
    }
}
// Loom's remapped copy of CC: Restitched drops the jars array, so the dev client never loads Cobalt.
// A normal install of the Modrinth jar still nests it. The screenshot run puts that jar on the classpath.
def extractCcNested = tasks.register('extractCcNested', Copy) {
    from {
        configurations.modCompileOnly.files.findAll { it.name.contains('cc-restitched') }.collect { zipTree(it) }
    }
    include 'META-INF/jars/Cobalt-*.jar'
    include 'META-INF/jars/netty-codec-http-*.jar'
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('cc-nested')
}
// The client and server runs start from the core source set. Module outputs have to be on that classpath
// or the dev game never loads Generators, Tools or Additions.
['runClient', 'runServer', 'runShowcaseClient', 'runJadeClient', 'runFissionClient', 'runComputerClient', 'runJetpackClient'].each { String taskName ->
    tasks.named(taskName) {
        classpath += sourceSets.generators.output
        classpath += sourceSets.tools.output
        classpath += sourceSets.additions.output
    }
}
tasks.named('runComputerClient') {
    dependsOn extractCcNested
    classpath += fileTree(layout.buildDirectory.dir('cc-nested')) { include '*.jar' }
}
tasks.named('processGametestResources', ProcessResources) {
    from('../src/gametestCommon/structures') { into 'data/mekanism/gametest/structures' }
}
tasks.named('runGametest') {
    // Item Alchemy only reads default_emcs when it has no saved emc_config.json.
    // CraftTweaker loads ZenScript from <run>/scripts. Without -PwithCraftTweaker the folder is removed.
    doFirst {
        delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy'), layout.buildDirectory.dir('gametest/scripts')
        if (withCraftTweaker) {
            project.copy {
                from '../src/gametestCommon/crafttweaker'
                into layout.buildDirectory.dir('gametest/scripts')
            }
        }
    }
}
