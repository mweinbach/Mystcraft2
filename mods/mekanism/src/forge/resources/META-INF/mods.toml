modLoader="javafml"
loaderVersion="[43,44)"
issueTrackerURL="https://github.com/mekanism/Mekanism/issues"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://aidancbrady.com/mekanism/"
    authors="${mod_authors}"
    credits="unpairedbracket, CyanideX, Ridanisaurus and many others"
    logoFile="logo.png"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.19.2]"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[43.5.0,44)"
    side="BOTH"
