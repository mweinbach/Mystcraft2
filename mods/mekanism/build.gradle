// Mekanism for Forge: the shared upstream sources plus the Forge-only adapters. The Fabric variant builds from the
// same shared sources in fabric/.
sourceSets.main.java.srcDir 'src/forge/java'
sourceSets.main.resources.srcDir 'src/forge/resources'
base.archivesName = 'mekanism-forge-1.19.2'

minecraft.accessTransformer = file('src/forge/resources/META-INF/accesstransformer.cfg')

dependencies {
    // Forge ships maven-artifact, Night Config and jsr305 at runtime; jsr305 is compile-only as upstream.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.quicktheories:quicktheories:0.26'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

// GameTests are merged into the mod only for the GameTest server run, never into the JAR.
['generators', 'tools', 'additions'].each { String name ->
    // The source set's own src/<name>/java and src/<name>/resources are the Gradle defaults.
    // Adding them again makes processResources see every file twice.
    def module = sourceSets.create(name)
    module.resources.srcDir "src/${name}/forge/resources"
    module.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    module.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
sourceSets {
    gametest {
        java.srcDirs = ['src/gametestCommon/java', 'src/gametestForge/java']
        resources.srcDirs = []
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.generators.output + sourceSets.tools.output + sourceSets.additions.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.generators.output + sourceSets.tools.output + sourceSets.additions.output
    }
}
minecraft.runs {
    gameTestServer {
        property 'forge.enableGameTest', 'true'
        property 'forge.enabledGameTestNamespaces', 'mekanism'
        mods {
            mekanism { source sourceSets.gametest }
        }
    }
}
def copyGameTestStructures = tasks.register('copyGameTestStructures', Sync) {
    from 'src/gametestCommon/structures'
    into 'run/gameTestServer/gameteststructures'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn copyGameTestStructures, tasks.named('gametestClasses')
    doFirst { delete file('run/gameTestServer/world') }
}

// Separate jars, one per upstream module, each depending on the core mod.
['generators', 'tools', 'additions'].each { String name ->
    def module = sourceSets.getByName(name)
    def modId = "mekanism${name}"
    tasks.named(module.processResourcesTaskName, ProcessResources) {
        inputs.properties portMetadata
        filesMatching('META-INF/mods.toml') {
            expand portMetadata
        }
        from('src/main/resources/logo.png')
    }
    def jarTask = tasks.register(module.jarTaskName, Jar) {
        from module.output
        archiveBaseName = "${modId}-forge-1.19.2"
        archiveClassifier = ''
        duplicatesStrategy = DuplicatesStrategy.FAIL
        manifest.attributes('Implementation-Title': modId, 'Implementation-Version': project.version)
        from('LICENSE')
    }
    def reobfTask = extensions.getByName('reobf').register(module.jarTaskName)
    reobfTask.configure { libraries.from(module.compileClasspath) }
    jarTask.configure { finalizedBy reobfTask }
    tasks.named('assemble') { dependsOn jarTask }
    minecraft.runs.configureEach {
        mods {
            "${modId}" { source module }
        }
    }
}

tasks.withType(Jar).configureEach {
    from('UPSTREAM.md') {
        into 'META-INF'
        rename { 'Mekanism-UPSTREAM.md' }
    }
    from('licenses') {
        into 'META-INF/licenses/mekanism'
        // Covers the Forge bucket assets bundled only in the Fabric jar.
        exclude 'Forge-LICENSE.txt'
    }
}
