// Mekanism for Forge: the shared upstream sources plus the Forge-only adapters. The Fabric variant builds from the
// same shared sources in fabric/.
sourceSets.main.java.srcDir 'src/forge/java'
sourceSets.main.resources.srcDir 'src/forge/resources'
base.archivesName = 'mekanism-forge-1.19.2'

minecraft.accessTransformer = file('src/forge/resources/META-INF/accesstransformer.cfg')

// Jade, The One Probe, CC: Tweaked, JEI, Curios, Wildfire's Gender Mod and ProjectE are optional at runtime. Their
// APIs are compile-only so the JAR loads without them. -PwithJade, -PwithTop, -PwithComputerCraft, -PwithJei,
// -PwithCurios, -PwithGender and -PwithProjectE add them to a development run.
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'org.squiddev' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    compileOnly(fg.deobf('maven.modrinth:jade:8.9.2')) { transitive = false }
    compileOnly(fg.deobf('maven.modrinth:the-one-probe:1.19-6.2.2')) { transitive = false }
    // Upstream Mekanism 10.3.9 compiled against this API. 1.101.3 and 1.101.4 are later 1.19.2 Forge builds.
    compileOnly(fg.deobf('org.squiddev:cc-tweaked-1.19.2:1.101.2:api')) { transitive = false }
    testImplementation(fg.deobf('org.squiddev:cc-tweaked-1.19.2:1.101.2:api')) { transitive = false }
    if (providers.gradleProperty('withComputerCraft').isPresent()) {
        runtimeOnly(fg.deobf('org.squiddev:cc-tweaked-1.19.2:1.101.2')) { transitive = false }
    }
    if (providers.gradleProperty('withJade').isPresent()) {
        runtimeOnly(fg.deobf('maven.modrinth:jade:8.9.2')) { transitive = false }
    }
    if (providers.gradleProperty('withTop').isPresent()) {
        runtimeOnly(fg.deobf('maven.modrinth:the-one-probe:1.19-6.2.2')) { transitive = false }
    }
    // Forge ships maven-artifact, Night Config and jsr305 at runtime; jsr305 is compile-only as upstream.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // JEI is optional at runtime. The plugin is only loaded when JEI asks for it.
    compileOnly fg.deobf('mezz.jei:jei-1.19.2-common-api:11.6.0.1015')
    compileOnly fg.deobf('mezz.jei:jei-1.19.2-forge-api:11.6.0.1015')
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly fg.deobf('mezz.jei:jei-1.19.2-forge:11.6.0.1015')
    }
    // Curios 1.19.2-5.1.4.1 is the build Mekanism 10.3.9 compiled against. The API jar is Mojmap, so it is not deobfuscated.
    compileOnly('top.theillusivec4.curios:curios-forge:1.19.2-5.1.4.1:api') { transitive = false }
    if (providers.gradleProperty('withCurios').isPresent()) {
        runtimeOnly(fg.deobf('top.theillusivec4.curios:curios-forge:1.19.2-5.1.4.1')) { transitive = false }
    }
    // Female Gender Mod forge-1.19.1-3.0.1 (CurseForge file 3920268) lists 1.19.2. Metadata version is 1.19-3.0.0.
    // Only IGenderArmor is compiled against, and that interface has no Minecraft types.
    compileOnly('curse.maven:female-gender-forge-481655:3920268') { transitive = false }
    // ProjectE 1.1.0 (CurseForge file 4860858) is the Forge build this pack's EMC data targets. The mappers are
    // compile-only; the mod is absent unless a development run asks for it.
    compileOnly(fg.deobf('curse.maven:projecte-226410:4860858')) { transitive = false }
    if (providers.gradleProperty('withProjectE').isPresent()) {
        runtimeOnly(fg.deobf('curse.maven:projecte-226410:4860858')) { transitive = false }
    }
    if (providers.gradleProperty('withGender').isPresent()) {
        runtimeOnly(fg.deobf('curse.maven:female-gender-forge-481655:3920268')) { transitive = false }
    }
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.quicktheories:quicktheories:0.26'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

// GameTests are merged into the mod only for the GameTest server run, never into the JAR.
['generators', 'tools', 'additions'].each { String name ->
    // The source set's own src/<name>/java and src/<name>/resources are the Gradle defaults.
    // Adding them again makes processResources see every file twice.
    def module = sourceSets.create(name)
    module.resources.srcDir "src/${name}/forge/resources"
    module.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    module.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
sourceSets {
    gametest {
        java.srcDirs = ['src/gametestCommon/java', 'src/gametestForge/java']
        resources.srcDirs = []
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.generators.output + sourceSets.tools.output + sourceSets.additions.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.generators.output + sourceSets.tools.output + sourceSets.additions.output
    }
}
// The EMC audit's data-side check is split out so a JUnit test can run it without a server.
sourceSets.test.compileClasspath += sourceSets.gametest.output
sourceSets.test.runtimeClasspath += sourceSets.gametest.output
tasks.named('test') { dependsOn tasks.named('gametestClasses') }
minecraft.runs {
    gameTestServer {
        property 'forge.enableGameTest', 'true'
        property 'forge.enabledGameTestNamespaces', 'mekanism'
        // MekanismModConfig drops NightConfig's file watch when this is set. See that class.
        property 'mekanism.gametest.skipConfigWatcher', 'true'
        // Binds computer methods so ComputerGameTests can run without CC: Tweaked installed.
        property 'mekanism.gametest.computer', 'true'
        // The shared EmcAudit reads the expected decisions from the checked-in values file.
        property 'emc.values', file('emc/values.json').absolutePath
        mods {
            mekanism { source sourceSets.gametest }
        }
    }
}
def copyGameTestStructures = tasks.register('copyGameTestStructures', Sync) {
    from 'src/gametestCommon/structures'
    into 'run/gameTestServer/gameteststructures'
}
// Forge 43.5.0 ships an fml.toml without defaultConfigPath, and a fresh GameTest server
// has no Mekanism configs. Startup then corrects those files while NightConfig's watcher
// reloads them. The two threads race on additions.toml and world.toml ("table declared
// twice", ConcurrentModificationException) before the ore tests read world generation.
// A complete fml.toml and spec-matching Mekanism configs skip that startup correction.
// Seeding is not enough on its own: additionswalkieselectschannelandcrafts later calls
// ConfigValue.set on additions.toml, and that autosave races the same watcher. The
// gameTestServer run sets mekanism.gametest.skipConfigWatcher so MekanismModConfig
// removes the watch. The writer covers every config registered by the core, generators,
// tools and additions jars.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn copyGameTestStructures, tasks.named('gametestClasses')
    doFirst {
        delete file('run/gameTestServer/world')
        def configDir = file('run/gameTestServer/config')
        configDir.mkdirs()
        new File(configDir, 'fml.toml').text = '''\
splashscreen = true
maxThreads = -1
versionCheck = true
defaultConfigPath = "defaultconfigs"
disableOptimizedDFU = true
'''
        // Forge's own specs are corrected the same way. These match Forge 43.5.0's defaults.
        new File(configDir, 'forge-common.toml').text = '''\

#[DEPRECATED / NO EFFECT]: General configuration settings
[general]
	#[DEPRECATED / NO EFFECT] [NOW IN RESOURCE-CACHING CONFIG]: Set this to true to cache resource listings in resource and data packs
	cachePackAccess = true
	#[DEPRECATED / NO EFFECT] [NOW IN RESOURCE-CACHING CONFIG]: Set this to true to index vanilla resource and data packs on thread
	indexVanillaPackCachesOnThread = false
	#[DEPRECATED / NO EFFECT] [NOW IN RESOURCE-CACHING CONFIG]: Set this to true to index mod resource and data packs on thread
	indexModPackCachesOnThread = false
'''
        def serverConfig = file('run/gameTestServer/world/serverconfig')
        serverConfig.mkdirs()
        new File(serverConfig, 'forge-server.toml').text = '''\
#Server configuration settings
[server]
	#Set this to true to remove any BlockEntity that throws an error in its update method instead of closing the server and reporting a crash log. BE WARNED THIS COULD SCREW UP EVERYTHING USE SPARINGLY WE ARE NOT RESPONSIBLE FOR DAMAGES.
	removeErroringBlockEntities = false
	#Set this to true to remove any Entity (Note: Does not include BlockEntities) that throws an error in its tick method instead of closing the server and reporting a crash log. BE WARNED THIS COULD SCREW UP EVERYTHING USE SPARINGLY WE ARE NOT RESPONSIBLE FOR DAMAGES.
	removeErroringEntities = false
	#Set this to true to check the entire entity's collision bounding box for ladders instead of just the block they are in. Causes noticeable differences in mechanics so default is vanilla behavior. Default: false.
	fullBoundingBoxLadders = false
	#Base zombie summoning spawn chance. Allows changing the bonus zombie summoning mechanic.
	#Range: 0.0 ~ 1.0
	zombieBaseSummonChance = 0.1
	#Chance that a zombie (or subclass) is a baby. Allows changing the zombie spawning mechanic.
	#Range: 0.0 ~ 1.0
	zombieBabyChance = 0.05
	#Fix advancement loading to use a proper topological sort. This may have visibility side-effects and can thus be turned off if needed for data-pack compatibility.
	fixAdvancementLoading = true
	#The permission handler used by the server. Defaults to forge:default_handler if no such handler with that name is registered.
	permissionHandler = "forge:default_handler"
	#Set this to true to enable living entities to use items with durations of 0. Fixes being able to use Eyes of Ender repeatedly by holding down the use button. Disabled by default as it could change interactions with items of existing mods.
	useItemWithDurationZero = false
'''
        project.javaexec {
            classpath = sourceSets.gametest.runtimeClasspath
            mainClass = 'mekanism.gametest.forge.WriteGameTestConfigs'
            args new File(configDir, 'Mekanism').absolutePath
        }
    }
}

// Separate jars, one per upstream module, each depending on the core mod.
['generators', 'tools', 'additions'].each { String name ->
    def module = sourceSets.getByName(name)
    def modId = "mekanism${name}"
    tasks.named(module.processResourcesTaskName, ProcessResources) {
        inputs.properties portMetadata
        filesMatching('META-INF/mods.toml') {
            expand portMetadata
        }
        from('src/main/resources/logo.png')
    }
    def jarTask = tasks.register(module.jarTaskName, Jar) {
        from module.output
        archiveBaseName = "${modId}-forge-1.19.2"
        archiveClassifier = ''
        duplicatesStrategy = DuplicatesStrategy.FAIL
        manifest.attributes('Implementation-Title': modId, 'Implementation-Version': project.version)
        from('LICENSE')
    }
    def reobfTask = extensions.getByName('reobf').register(module.jarTaskName)
    reobfTask.configure { libraries.from(module.compileClasspath) }
    jarTask.configure { finalizedBy reobfTask }
    tasks.named('assemble') { dependsOn jarTask }
    minecraft.runs.configureEach {
        mods {
            "${modId}" { source module }
        }
    }
}

tasks.withType(Jar).configureEach {
    from('UPSTREAM.md') {
        into 'META-INF'
        rename { 'Mekanism-UPSTREAM.md' }
    }
    from('licenses') {
        into 'META-INF/licenses/mekanism'
        // Covers the Forge bucket assets bundled only in the Fabric jar.
        exclude 'Forge-LICENSE.txt'
    }
}
