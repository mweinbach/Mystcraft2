plugins {
    id 'fabric-loom' version '1.7.4'
}

def metadata = new Properties()
file('../port.properties').withInputStream { metadata.load(it) }
version = metadata.mod_version
group = metadata.mod_group
base.archivesName = 'buildcraft-fabric-1.19.2'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
        content { includeGroup 'teamreborn' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Item Alchemy 1.1.3, the Fabric EMC mod, checks the shipped default_emcs data against real values.
    if (providers.gradleProperty('withItemAlchemy').isPresent()) {
        modRuntimeOnly 'maven.modrinth:item-alchemy:1AYUTFS2'
        modRuntimeOnly 'maven.modrinth:mcpitanlibarch:cTAftMK5'
        modRuntimeOnly 'maven.modrinth:architectury-api:cde9Su0w'
    }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Team Reborn Energy (MIT) is the Fabric energy API; ship it inside the JAR like other Fabric mods do.
    include(modApi("teamreborn:energy:${project.energy_version}") { transitive = false })
    // MixinExtras (MIT) for the Fabric-only mixins in buildcraft.fabric.mixins.json; its processor writes their refmap entries.
    include(modImplementation('io.github.llamalad7:mixinextras-fabric:0.4.1'))
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.4.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
sourceSets {
    main {
        java.setSrcDirs(['../src/main/java', '../src/fabric/java'])
        resources.setSrcDirs(['../src/main/resources', '../src/fabric/resources'])
    }
    // In-world tests are a separate development-only mod; they never enter the production JAR.
    gametest {
        java.setSrcDirs(['../src/gametestCommon/java', '../src/gametestFabric/java'])
        resources.setSrcDirs(['../src/gametestCommon/resources', '../src/gametestFabric/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
    filesMatching('pack.mcmeta') { expand metadata }
}
tasks.withType(Jar).configureEach {
    from('../UPSTREAM.md') {
        into 'META-INF'
        rename { 'BuildCraft-UPSTREAM.md' }
    }
    from('../licenses') { into 'META-INF/licenses/buildcraft' }
}
tasks.named('jar', Jar) { from('../LICENSE') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

loom {
    mixin { defaultRefmapName = 'buildcraft.refmap.json' }
    mods {
        buildcraft { sourceSet sourceSets.main }
        buildcraft_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        client { runDir '../run/fabric-client' }
        server { runDir '../run/fabric-server'; programArg '--nogui' }
        gametest {
            server()
            name 'BuildCraft Fabric Game Tests'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            vmArg "-Demc.values=${file('../emc/values.json')}"
            vmArg "-Dbuildcraft.uncraftable=${file('../uncraftable.txt')}"
        }
        // A client with the development-only /bcshowcase command, for screenshots.
        showcaseClient {
            client()
            name 'BuildCraft Fabric Showcase Client'
            source sourceSets.gametest
            runDir 'build/showcase'
            programArgs '--width', '1600', '--height', '900'
        }
    }
}
tasks.named('runGametest') {
    // Item Alchemy only reads default_emcs when it has no saved emc_config.json.
    doFirst { delete layout.buildDirectory.dir('gametest/world'), layout.buildDirectory.dir('gametest/config/itemalchemy') }
}
