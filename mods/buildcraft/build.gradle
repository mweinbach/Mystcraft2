// BuildCraft for Forge: shared gameplay plus the Forge registration, capability and client
// adapters. The Fabric variant builds from the same shared sources in fabric/.
sourceSets.main.java.srcDir 'src/forge/java'
sourceSets.main.resources.srcDir 'src/forge/resources'
base.archivesName = 'buildcraft-forge-1.19.2'

tasks.withType(Jar).configureEach {
    from('UPSTREAM.md') {
        into 'META-INF'
        rename { 'BuildCraft-UPSTREAM.md' }
    }
    from('licenses') { into 'META-INF/licenses/buildcraft' }
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    // ProjectE 1.1.0 (CurseForge file 4860858) checks the shipped EMC data against real values.
    if (providers.gradleProperty('withProjectE').isPresent()) {
        runtimeOnly fg.deobf('curse.maven:projecte-226410:4860858')
    }
}

// The shared mixins name official members; production Forge needs their SRG names from a refmap.
// Loom writes the Fabric refmap under the same name.
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
def mixinRefmap = layout.buildDirectory.file('generated/mixin/buildcraft.refmap.json')
tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('createMcpToSrg')
    outputs.file(mixinRefmap)
    doFirst { mixinRefmap.get().asFile.parentFile.mkdirs() }
    options.compilerArgs += [
        '-AmappingTypes=tsrg',
        "-AreobfTsrgFile=${layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile}",
        "-AoutRefMapFile=${mixinRefmap.get().asFile}",
        '-AdefaultObfuscationEnv=searge'
    ]
}
tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')
    from(mixinRefmap)
}
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'buildcraft.mixins.json')
}
minecraft.runs.configureEach {
    args '--mixin.config', 'buildcraft.mixins.json'
    property 'mixin.env.remapRefMap', 'true'
    property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
}
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn tasks.named('createSrgToMcp') }

// In-world tests are a development-only source set; they never enter the production JAR.
sourceSets {
    gametest {
        java.srcDirs = ['src/gametestCommon/java', 'src/gametestForge/java']
        resources.srcDirs = ['src/gametestCommon/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft.runs {
    gameTestServer {
        property 'forge.enableGameTest', 'true'
        property 'forge.enabledGameTestNamespaces', 'buildcraft'
        property 'emc.values', file('emc/values.json').absolutePath
        property 'buildcraft.uncraftable', file('uncraftable.txt').absolutePath
        mods { buildcraft { source sourceSets.gametest } }
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('gametestClasses')
    doFirst { delete file('run/gameTestServer/world') }
}
