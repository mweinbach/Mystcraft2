apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'idea'
apply plugin: 'eclipse'

def metadata = new Properties()
file('port.properties').withInputStream { metadata.load(it) }
['mod_id', 'mod_name', 'mod_version', 'mod_group', 'mod_license',
 'mod_authors', 'mod_description', 'upstream_url', 'upstream_revision', 'port_status'].each {
    if (!metadata.getProperty(it)?.trim()) {
        throw new GradleException("${project.path}: missing ${it} in port.properties")
    }
}
if (metadata.mod_id != project.name) {
    throw new GradleException("${project.path}: mod_id must match its directory")
}
ext.portMetadata = metadata
group = metadata.mod_group
version = metadata.mod_version
base.archivesName = "${metadata.mod_id}-${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file("run/${name}")
            property 'forge.logging.console.level', 'info'
            mods {
                "${metadata.mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
        data {
            args '--mod', metadata.mod_id, '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources) {
    inputs.properties metadata
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand metadata
    }
}

tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Title': metadata.mod_name,
                        'Implementation-Version': metadata.mod_version)
    if (file('LICENSE').isFile()) { from('LICENSE') }
    finalizedBy 'reobfJar'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
