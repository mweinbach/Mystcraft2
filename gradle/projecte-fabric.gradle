// Applied by every Fabric port build. With -PwithProjectE, a development run loads this repository's ProjectE Fabric
// port (mods/projecte), so the port's EmcAudit GameTest compares ProjectE's live values with emc/values.json, as
// -PwithProjectE does with the published ProjectE on Forge. Nothing here reaches a port's production jar.
//
// The remapped jar is used rather than an included build: ICBM uses Yarn names and the other ports Mojang's, and
// Loom remaps a jar to either. Loom's development copy of a mod drops its nested jars, so they are added here too.
if (providers.gradleProperty('withProjectE').isPresent()) {
    def repoRoot = buildscript.sourceFile.parentFile.parentFile
    def projectEMetadata = new Properties()
    new File(repoRoot, 'mods/projecte/port.properties').withInputStream { projectEMetadata.load(it) }
    def projectEJar = new File(repoRoot,
        "mods/projecte/fabric/build/libs/projecte-fabric-1.19.2-${projectEMetadata.getProperty('mod_version')}.jar")
    // Loom inspects runtime mods while configuring, so the jar must exist before then.
    if (!projectEJar.isFile()) {
        exec {
            workingDir repoRoot
            commandLine new File(repoRoot, 'gradlew').absolutePath, '--no-daemon', '-p', 'mods/projecte/fabric', 'remapJar'
        }
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
    }
    dependencies {
        modRuntimeOnly files(projectEJar)
        // The jars ProjectE nests (see mods/projecte/fabric/build.gradle).
        modRuntimeOnly('me.lucko:fabric-permissions-api:0.3.1') { transitive = false }
        runtimeOnly 'com.electronwill.night-config:core:3.6.6'
        runtimeOnly 'com.electronwill.night-config:toml:3.6.6'
        runtimeOnly 'org.apache.maven:maven-artifact:3.8.5'
        runtimeOnly 'org.apache.commons:commons-math3:3.6.1'
    }
    // ProjectE can load values pregenerated by an earlier run instead of mapping them; start every run clean.
    tasks.withType(JavaExec).matching { it.name ==~ /run[A-Z].*/ }.configureEach { task ->
        task.doFirst { new File(task.workingDir, 'config/ProjectE/pregenerated_emc.json').delete() }
    }
}
